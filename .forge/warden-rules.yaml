rules:
    - id: throw-on-unknown-enum-value
      category: error-handling
      pattern: >-
        A mapping/formatting function branches on enum values with an if/else or default fallback (e.g. treating any non-matching value as a default label) instead of exhaustively handling every enum member
      check: >-
        Verify the function throws (or otherwise fails loudly) for unrecognized/unmapped enum values rather than silently defaulting to one of the known labels, consistent with how other enum/token mappings in the codebase already handle unknown values
      source: copilot:PR#23
      added: "2026-08-18"
      paths:
        - changelog.d/**/*.md
        - samples/**/*.css
        - src/**/*.cs
        - src/**/*.razor
        - test/**/*.cs
    - id: no-mixed-language-record-field-names
      category: style
      pattern: >-
        A record/class groups multiple related fields under one naming scheme (e.g. a `Tekster`/translation record), and a newly added field breaks that scheme by mixing languages or naming conventions (e.g. Norwegian `Felt*` fields alongside an English `FieldX` name)
      check: >-
        Verify new fields follow the same language/naming convention as sibling fields in the same type, and that any switch/mapping arms and call-site named arguments referencing the field are updated consistently
      source: copilot:PR#23
      added: "2026-08-18"
      paths:
        - changelog.d/**/*.md
        - samples/**/*.css
        - src/**/*.cs
        - src/**/*.razor
        - test/**/*.cs
    - id: tcs-run-continuations-async
      category: concurrency
      pattern: >-
        A `TaskCompletionSource` is created without `TaskCreationOptions.RunContinuationsAsynchronously` and is later awaited while another thread (e.g. a renderer callback) calls `SetResult`/`SetException`/`SetCanceled` on it
      check: >-
        Verify the TaskCompletionSource is constructed with `TaskCreationOptions.RunContinuationsAsynchronously` so the awaiter's continuation runs asynchronously instead of inline on the thread calling Set*, preventing reentrancy and flakiness in renderer-driven or otherwise concurrent tests. Inline completion is the correct choice, and this rule does not apply, when a test has to observe an answer the code under test is expected to discard: a dropped answer leaves nothing to poll, so the test can only know it has landed by the continuation having run before Set* returned. Such a stall says so at its construction — see `AnswerStalledCodes` in `test/Fhi.Munin.Explorer.Tests/VariableExplorerTest.cs`
      source: copilot:PR#154
      added: "2026-09-02"
      paths:
        - '**/*.cs'
        - '**/*.razor'
    - id: readme-accuracy-with-code-changes
      category: documentation
      pattern: >-
        A PR changes behavior (e.g., adds writes, authentication, or new capabilities) that contradicts a claim in README.md or other docs
      check: >-
        Verify README/docs are updated to match the new behavior when a PR changes something the docs assert about the system (e.g., 'read-only', 'anonymous')
      source: copilot:PR#154
      added: "2026-09-02"
      paths:
        - '**/*.cs'
        - '**/*.json'
        - '**/*.md'
        - '**/*.razor'
    - id: css-comment-cites-wrong-value
      category: style
      pattern: >-
        A comment in a stylesheet (or beside markup) that quotes a concrete numeric value — padding, margin, width, height — as the reason a nearby rule exists
      check: >-
        Read the adjacent rule and confirm every number the comment cites matches what the rule actually declares; if the quoted value is wrong or is not the property the sizing depends on, restate the comment around the load-bearing declaration (e.g. the 24px icon box) or drop the number rather than leave a false dependency in the file
      source: copilot:PR#225
      added: "2026-09-09"
      paths:
        - samples/**/*.css
    - id: comment-three-line-ceiling
      category: style
      pattern: >-
        A diff adds or expands a comment block — in C#, Razor, or a shell script or JavaScript module under scripts/ — that runs beyond three lines, or narrates what the code does.
      check: >-
        Verify every added comment is at most three lines and states only the invariant or the why. Incidental detail and worked examples belong in the bead, the PR description, or AGENTS.md — not in a file people reopen on every visit. The sole exception is public XML doc comments on the package's API, whose reader has only the package. Leave incident and PR history to comment-history-not-incident-history, which covers the same files: flagging it here too fires twice on one comment and lets the two rules drift apart.
      source: copilot:PR#225
      added: "2026-09-09"
      paths:
        - scripts/**/*.mjs
        - scripts/**/*.sh
        - src/**/*.cs
        - src/**/*.razor
        - test/**/*.cs
    - id: css-box-claim-must-match-applied-rules
      category: ui
      pattern: >-
        A comment, PR description, or review note explains an element's computed box (padding, width, height — typically a WCAG target-size or layout fix) by asserting what a borrowed utility class does, e.g. that `hd-button-reset` strips padding so the glyph is the whole control.
      check: >-
        Before accepting the explanation, read every rule that actually applies to the element in cascade order, including the component's own `munin-explorer*` rule, and confirm the stated cause is the one that wins. A later component rule can reinstate what a utility reset removed (`.munin-explorer-kilder__expand-toggle` sets `padding: 4px 6px`), so the real defect may be that glyph plus padding still measures under the minimum. Reject a plausible-sounding cause that the stylesheets contradict, and require the prose to name the measured cause instead.
      source: copilot:PR#225
      added: "2026-09-09"
      paths:
        - src/**/*.cs
    - id: target-size-from-measured-box-not-reset-class
      category: ui
      pattern: >-
        A test, comment, or review claim reasons about an interactive element's rendered box size (e.g. the WCAG 2.1 AA 24x24 minimum target size) by inferring it from the CSS classes on the element — typically a reset class such as `hd-button-reset` — rather than from a measured box.
      check: >-
        Verify the size claim against what is actually measured (check-hostile-host.sh / a rendered box), not against class names. A reset class does not mean the element has no box: component rules on the same element still add padding, borders and line-height, and conversely padding may still not be enough when the glyph or label inside is narrower than the minimum. State which dimension actually falls short and what supplies the remaining width/height.
      source: copilot:PR#225
      added: "2026-09-09"
      paths:
        - test/**/*.cs
    - id: tooling-failure-vs-finding-exit-code
      category: error-handling
      pattern: >-
        A check script that documents distinct exit codes for "clean", "defect found", and "could not run" (e.g. 0/1/2) and exits after a build, restore, host startup, or browser launch step fails
      check: >-
        Verify that every failure of a prerequisite step — build, restore, host startup, browser/Playwright launch, port wait — exits with the tooling-failure code (2) and a message naming it as a tooling failure, not the finding code (1). Check every early-exit path in the script, not just the first: the same infrastructure step is often guarded in more than one place, and one of them returning 1 misreports a broken environment as a real component defect and makes CI blame the change under test.
      source: copilot:PR#254
      added: "2026-09-10"
      paths:
        - scripts/**/*.sh
    - id: regression-guard-must-fail-without-fix
      category: testing
      pattern: >-
        A new test, assertion, or CI guard added to catch a specific regression, where the production element it claims to guard — shipped markup, an attribute, a call, a script — is absent from this revision or stood up by the test itself instead of being exercised
      check: >-
        Verify the assertion can actually fail on this revision: confirm the production call or attribute it guards exists in the shipped code, and that deleting or breaking that specific production element makes this assertion red. A guard built around a not-yet-implemented shape, or asserting over a box the harness constructed, proves only that the measurement harness works — it does not guard the regression. What makes a guard synthetic is the guarded element, not its surroundings: faking a collaborator (deriving from `EmptyMuninExplorerClient`) or feeding an input broken on purpose is how the guards here reach the markup, handler or script actually under guard, and `ShapeDriftTest` and `DriftRanGuardTest` are required to do exactly that. Read what deleting the production element would do: if the assertion stays green because the test supplied the element itself, this is the defect; if it turns red, the stub and the broken-on-purpose payload are doing their job. If the implementation lands in a later PR, hold the guard until then or point it at the real implementation now.
      source: copilot:PR#254
      added: "2026-09-10"
      paths:
        - scripts/**/*.mjs
        - scripts/**/*.sh
        - test/**/*.cs
    - id: wire-contract-untested-by-json
      category: testing
      pattern: >-
        A new or changed DTO/wire contract (new type, property, or `[JsonPropertyName]`) where the tests construct the object directly in C# rather than deserializing it from a JSON fixture
      check: >-
        Verify a deserialization test reads the new member from JSON and asserts every new field — wire name, IDs, parent IDs, names, counts. Where the capture can carry the value, re-take the whole file under Testdata/ as docs/contract-drift.md says; a member hand-added to one is reverted without a word by the next capture. Where the value moves with the catalogue — fixed ids, parent ids, counts — pin the wire names against an inline `WithJson` payload instead, as `MuninExplorerClientTest` does under "wire names the capture cannot pin". Tests that new up the DTO in C# pass even when the wire name or field shape is wrong, so they are not evidence the contract matches Munin's JSON. Note that a fixture carrying the member is not itself that evidence either: `ContractCoverageTest` reads with UnmappedMemberHandling.Disallow, which proves only that every field the API sends has somewhere to land.
      source: copilot:PR#250
      added: "2026-09-10"
      paths:
        - src/**/*.cs
        - test/**/*.cs
    - id: xmldoc-mixed-compat-claim
      category: documentation
      pattern: >-
        XML doc comment describes a compatibility/migration scenario where an old member and a new member coexist (e.g. deprecated collection kept populated alongside a newly added replacement)
      check: >-
        Verify the doc text doesn't claim contradictory states for the same member (e.g. 'populated' and 'empty' both said of the same collection) — confirm which member stays populated and which starts empty, and check every duplicated copy of the doc comment (e.g. on both the property and its backing field or XML tag) for the same inconsistency
      source: copilot:PR#290
      added: "2026-09-14"
      paths:
        - src/**/*.cs
    - id: changelog-fragment-english-only
      category: style
      pattern: >-
        A changelog fragment in changelog.d/ contains Norwegian domain terms (e.g. datakategorier, datakategori) instead of English in its title or body
      check: >-
        Verify the title and body of every changelog.d/*.md fragment the diff adds or edits are English-only — standing fragments this PR does not touch are out of scope — translating any Norwegian term the canonical list in AGENTS.md ("Norwegian stays where it is read, not called") does not keep untranslated. That list is kilde, datasamling, delkilde, variabelgruppe, kildetype and kodeverk with the kinds it comes in (helsefagligKodeverk, administrativtKodeverk, kildekodeverk), plus the Norwegian plurals the API uses for their collections — kilder, delkilder, datasamlinger, variabelgrupper, kildetyper. Also untranslated, though AGENTS.md's list does not name them: kildeutforsker and variabelutforsker, this repository's own names for its two views, which ship throughout CHANGELOG.md, AGENTS.md and CLAUDE.md. Read AGENTS.md rather than trusting this restatement of it, which can drift; terms it keeps already ship in CHANGELOG.md and must not be flagged
      source: copilot:PR#302
      added: "2026-09-14"
      paths:
        - changelog.d/**/*.md
    - id: comment-history-not-incident-history
      category: style
      pattern: >-
        A comment anywhere in the repository — a test, a source or Razor file, a script — explains why the code exists by narrating past states (old counts, prior capture behavior, bead/PR history) instead of stating the current invariant
      check: >-
        Verify the comment states only the present-tense invariant the code enforces; confirm any incident history, counts, or 'used to'/'previously' narrative is removed and belongs in the bead instead. Public XML doc comments on the package's API are the exception, as AGENTS.md's "Comments" section has it: their reader has the package from the feed and its IntelliSense, not this repository, so a migration note they cannot reconstruct from the signature — what a member used to hold before the API resolved it — stays in the file, and the bead it would move to is unreadable to them. Internal types, tests and scripts have no such reader
      source: copilot:PR#302
      added: "2026-09-14"
      paths:
        - scripts/**/*.mjs
        - scripts/**/*.sh
        - src/**/*.cs
        - src/**/*.razor
        - test/**/*.cs
    - id: doc-prose-grammar
      category: style
      pattern: >-
        Prose in reader-facing shipped text with no later editing pass — a changelog.d/ fragment or a public XML doc comment (<summary>, <remarks>, <param>)
      check: >-
        Read each sentence as written and verify it is grammatical — in particular that omitted relative pronouns ('that', 'which', 'who'), articles, and prepositions are present where the sentence needs them, since the text is assembled or shipped verbatim with no chance to fix it later.
      source: copilot:PR#250
      added: "2026-09-14"
      paths:
        - changelog.d/**/*.md
        - src/**/*.cs
    - id: collapse-before-per-id-lookup
      category: correctness
      pattern: >-
        A collection of records sharing a logical ID is grouped/partitioned by a secondary key (e.g. by parent/owner) before a downstream step deduplicates to one entry per ID (e.g. via OnePerId)
      check: >-
        Verify deduplication by ID happens globally, before grouping by the secondary key — not per-group afterward — otherwise the same ID can survive as a duplicate in multiple buckets and be exposed twice to callers (e.g. as duplicate selectable options).
      source: copilot:PR#312
      added: "2026-09-15"
      paths:
        - src/**/*.cs
    - id: dedupe-applied-to-selection-not-render
      category: correctness
      pattern: >-
        De-duplicating a repeated-ID payload (e.g. from `levels`) but then a sibling method still enumerates the raw, non-deduplicated collection (e.g. `facets.Datasamlinger`) when building selectable/rendered items or chips
      check: >-
        When a payload is known to contain duplicate IDs and one code path de-duplicates by ID, verify every other code path that consumes the same raw collection to build selection state or UI output (chips, selected rows, etc.) applies the same ID de-duplication — and that a selected-state rendering test exists covering the duplicate-ID case.
      source: copilot:PR#312
      added: "2026-09-15"
      paths:
        - src/**/*.cs
    - id: norwegian-identifier-not-in-domain-list
      category: style
      pattern: >-
        A new C# identifier (class, property, local, method, etc.) uses a Norwegian word or abbreviation that is not one of the repository's approved closed-list domain terms defined in AGENTS.md under "Norwegian stays where it is read, not called"
      check: >-
        Read the canonical list in AGENTS.md before flagging a name. Keep `kilde`, `datasamling`, `delkilde`, `variabelgruppe`, `kildetype`, `kodeverk`, and its kinds (`helsefagligKodeverk`, `administrativtKodeverk`, `kildekodeverk`), plus the Norwegian collection plurals (`Kilder`, `Delkilder`, `Datasamlinger`, `Variabelgrupper`, `KildeTyper`), with casing appropriate to the identifier. All other identifier words must be English; abbreviations such as `gruppe` instead of `variabelgruppe` are not approved domain terms.
      source: copilot:PR#312
      added: "2026-09-15"
      paths:
        - src/**/*.cs
        - src/**/*.razor
        - test/**/*.cs
        - test/**/*.razor
    - id: test-identifiers-full-domain-term
      category: style
      pattern: >-
        A test file introduces a new helper/local/method name that abbreviates a Norwegian domain term (e.g. `Gruppe`/`gruppe`/`grupper` instead of `Variabelgruppe`/`variabelgruppe`/`variabelgrupper`)
      check: >-
        Verify all new test identifiers (helper names, locals, call sites) spell out the full domain term rather than an abbreviation, consistent with the English/full-domain-term identifier rule that applies to production code
      source: copilot:PR#312
      added: "2026-09-15"
      paths:
        - test/**/*.cs
    - id: no-duplicate-css-rules
      category: style
      pattern: >-
        A new CSS block is added to a stylesheet that duplicates an existing, unchanged rule already present elsewhere in the same file (e.g. a Stiler-aligned selector re-declared with identical or overlapping properties)
      check: >-
        Search the target stylesheet for an existing selector/rule covering the same element before adding a new block; if one already exists and is unchanged, remove the new duplicate and keep the original rather than leaving two copies in the cascade
      source: copilot:PR#311
      added: "2026-09-15"
      paths:
        - samples/**/*.css
    - id: icon-only-content-needs-text-alternative
      category: ui
      pattern: >-
        A UI element conveys meaning solely through an icon/glyph (e.g. category icons in a filter row), with no adjacent visible text carrying the same information
      check: >-
        Verify the icon has an accompanying screen-reader-only text description (not just an unchanged accessible name on the container) so the association it conveys survives for assistive tech, following the existing pattern (e.g. KildeHierarchyView.razor.cs) rather than hiding the icon slot entirely
      source: copilot:PR#311
      added: "2026-09-15"
      paths:
        - src/**/*.cs
        - src/**/*.razor
    - id: responsive-toolbar-fit-at-reflow-width
      category: ui
      pattern: >-
        A new toggle/control is added to a fixed-width, no-wrap toolbar (fixed gaps, controls without min-width: 0) inside a component that must render at the 320px WCAG reflow width
      check: >-
        Verify the toolbar's controls can shrink or wrap at 320px viewport width without overflow or clipping — check that new children get min-width: 0 (or the toolbar allows wrapping), and confirm a 320px layout/geometry test covers the new control before shipping
      source: copilot:PR#333
      added: "2026-09-16"
      paths:
        - src/**/*.razor
    - id: docs-invalidated-by-new-parameter
      category: other
      pattern: >-
        A new public parameter, member, or code path is added that contradicts an existing XML doc comment/remarks elsewhere in the codebase (e.g. a remarks block claiming a capability isn't exposed, or a usage requirement that is no longer universally true)
      check: >-
        Search for existing public documentation (XML doc comments, remarks, README) that makes claims about what is or isn't supported, and update it to reflect the new parameter/behavior so consumers relying on IntelliSense aren't given contradictory guidance
      source: copilot:PR#333
      added: "2026-09-16"
      paths:
        - src/**/*.cs
        - src/**/*.razor
    - id: pr-body-closes-bead-mismatch
      category: other
      pattern: >-
        A PR whose diff completes a bead's acceptance criteria (implementation + changelog fragment present) but whose PR body uses `Bead: <id>` instead of `Closes-Bead: <id>`, or relies on a GitHub issue reference instead
      check: >-
        Verify the PR body's bead line matches the actual completion state: use `Closes-Bead: <id>` only when the work fully satisfies the bead's criteria, and confirm it's a standalone line (not a GitHub `Closes #N` reference, which does not close beads since beads aren't GitHub issues)
      source: copilot:PR#343
      added: "2026-09-17"
      paths:
        - changelog.d/**
        - changelog.d/**/*.md
    - id: warden-rule-preserves-norwegian-domain-terms
      category: other
      pattern: >-
        A review rule (e.g. in .forge/warden-rules.yaml) instructs translating or flagging Norwegian identifiers to enforce the English-identifiers convention
      check: >-
        Verify the rule's exception list matches AGENTS.md in full, including `delkilde` and the Norwegian plural forms alongside `kilde`, `datasamling`, `variabelgruppe`, `kildetype`, and `kodeverk` — not just a subset — so it doesn't flag valid domain vocabulary already used in changelog fragments and code
      source: copilot:PR#307
      added: "2026-09-17"
      paths:
        - .forge/**/*.yaml
    - id: warden-rule-path-scope-matches-stated-scope
      category: other
      pattern: >-
        A review rule's description states a scope broader than 'tests' (e.g. 'covers comments in other code' or applies repo-wide per AGENTS.md), but the rule's path filter (e.g. in .forge/warden-rules.yaml) only matches test files
      check: >-
        Confirm the rule's path/file-glob filter actually matches every file type the rule's own description or the referenced convention claims to cover (source C#/Razor, scripts, etc.), not just test files
      source: copilot:PR#307
      added: "2026-09-17"
      paths:
        - .forge/**/*.yaml
