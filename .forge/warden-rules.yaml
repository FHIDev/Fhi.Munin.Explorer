rules:
    - id: throw-on-unknown-enum-value
      category: error-handling
      pattern: >-
        A mapping/formatting function branches on enum values with an if/else or default fallback (e.g. treating any non-matching value as a default label) instead of exhaustively handling every enum member
      check: >-
        Verify the function throws (or otherwise fails loudly) for unrecognized/unmapped enum values rather than silently defaulting to one of the known labels, consistent with how other enum/token mappings in the codebase already handle unknown values
      source: copilot:PR#23
      added: "2026-08-18"
      paths:
        - changelog.d/**/*.md
        - samples/**/*.css
        - src/**/*.cs
        - src/**/*.razor
        - test/**/*.cs
    - id: no-mixed-language-record-field-names
      category: style
      pattern: >-
        A record/class groups multiple related fields under one naming scheme (e.g. a `Tekster`/translation record), and a newly added field breaks that scheme by mixing languages or naming conventions (e.g. Norwegian `Felt*` fields alongside an English `FieldX` name)
      check: >-
        Verify new fields follow the same language/naming convention as sibling fields in the same type, and that any switch/mapping arms and call-site named arguments referencing the field are updated consistently
      source: copilot:PR#23
      added: "2026-08-18"
      paths:
        - changelog.d/**/*.md
        - samples/**/*.css
        - src/**/*.cs
        - src/**/*.razor
        - test/**/*.cs
    - id: tcs-run-continuations-async
      category: concurrency
      pattern: >-
        A `TaskCompletionSource` is created without `TaskCreationOptions.RunContinuationsAsynchronously` and is later awaited while another thread (e.g. a renderer callback) calls `SetResult`/`SetException`/`SetCanceled` on it
      check: >-
        Verify the TaskCompletionSource is constructed with `TaskCreationOptions.RunContinuationsAsynchronously` so the awaiter's continuation runs asynchronously instead of inline on the thread calling Set*, preventing reentrancy and flakiness in renderer-driven or otherwise concurrent tests. Inline completion is the correct choice, and this rule does not apply, when a test has to observe an answer the code under test is expected to discard: a dropped answer leaves nothing to poll, so the test can only know it has landed by the continuation having run before Set* returned. Such a stall says so at its construction — see `AnswerStalledCodes` in `test/Fhi.Munin.Explorer.Tests/VariableExplorerTest.cs`
      source: copilot:PR#154
      added: "2026-09-02"
      paths:
        - '**/*.cs'
        - '**/*.razor'
    - id: readme-accuracy-with-code-changes
      category: documentation
      pattern: >-
        A PR changes behavior (e.g., adds writes, authentication, or new capabilities) that contradicts a claim in README.md or other docs
      check: >-
        Verify README/docs are updated to match the new behavior when a PR changes something the docs assert about the system (e.g., 'read-only', 'anonymous')
      source: copilot:PR#154
      added: "2026-09-02"
      paths:
        - '**/*.cs'
        - '**/*.json'
        - '**/*.md'
        - '**/*.razor'
    - id: css-comment-cites-wrong-value
      category: style
      pattern: >-
        A comment in a stylesheet (or beside markup) that quotes a concrete numeric value — padding, margin, width, height — as the reason a nearby rule exists
      check: >-
        Read the adjacent rule and confirm every number the comment cites matches what the rule actually declares; if the quoted value is wrong or is not the property the sizing depends on, restate the comment around the load-bearing declaration (e.g. the 24px icon box) or drop the number rather than leave a false dependency in the file
      source: copilot:PR#225
      added: "2026-09-09"
      paths:
        - samples/**/*.css
    - id: comment-three-line-ceiling
      category: style
      pattern: >-
        A diff adds or expands a comment block — in C#, Razor, or a shell script under scripts/ — that runs beyond three lines, or narrates what the code does, or records incident/PR history inline.
      check: >-
        Verify every added comment is at most three lines and states only the invariant or the why. Incidental detail, worked examples, and incident history belong in the bead, the PR description, or AGENTS.md — not in a file people reopen on every visit. The sole exception is public XML doc comments on the package's API, whose reader has only the package.
      source: copilot:PR#225
      added: "2026-09-09"
      paths:
        - scripts/**/*.sh
    - id: css-box-claim-must-match-applied-rules
      category: ui
      pattern: >-
        A comment, PR description, or review note explains an element's computed box (padding, width, height — typically a WCAG target-size or layout fix) by asserting what a borrowed utility class does, e.g. that `hd-button-reset` strips padding so the glyph is the whole control.
      check: >-
        Before accepting the explanation, read every rule that actually applies to the element in cascade order, including the component's own `munin-explorer*` rule, and confirm the stated cause is the one that wins. A later component rule can reinstate what a utility reset removed (`.munin-explorer-kilder__expand-toggle` sets `padding: 4px 6px`), so the real defect may be that glyph plus padding still measures under the minimum. Reject a plausible-sounding cause that the stylesheets contradict, and require the prose to name the measured cause instead.
      source: copilot:PR#225
      added: "2026-09-09"
      paths:
        - src/**/*.cs
    - id: target-size-from-measured-box-not-reset-class
      category: ui
      pattern: >-
        A test, comment, or review claim reasons about an interactive element's rendered box size (e.g. the WCAG 2.1 AA 24x24 minimum target size) by inferring it from the CSS classes on the element — typically a reset class such as `hd-button-reset` — rather than from a measured box.
      check: >-
        Verify the size claim against what is actually measured (check-hostile-host.sh / a rendered box), not against class names. A reset class does not mean the element has no box: component rules on the same element still add padding, borders and line-height, and conversely padding may still not be enough when the glyph or label inside is narrower than the minimum. State which dimension actually falls short and what supplies the remaining width/height.
      source: copilot:PR#225
      added: "2026-09-09"
      paths:
        - test/**/*.cs
    - id: tooling-failure-vs-finding-exit-code
      category: error-handling
      pattern: >-
        A check script that documents distinct exit codes for "clean", "defect found", and "could not run" (e.g. 0/1/2) and exits after a build, restore, host startup, or browser launch step fails
      check: >-
        Verify that every failure of a prerequisite step — build, restore, host startup, browser/Playwright launch, port wait — exits with the tooling-failure code (2) and a message naming it as a tooling failure, not the finding code (1). Check every early-exit path in the script, not just the first: the same infrastructure step is often guarded in more than one place, and one of them returning 1 misreports a broken environment as a real component defect and makes CI blame the change under test.
      source: copilot:PR#254
      added: "2026-09-10"
      paths:
        - scripts/**/*.sh
    - id: regression-guard-must-fail-without-fix
      category: testing
      pattern: >-
        A new test, assertion, or CI guard added to catch a specific regression, where the production code path it claims to guard is absent, stubbed, or synthetically constructed within the test itself
      check: >-
        Verify the assertion can actually fail on this revision: confirm the production call or attribute it guards exists in the shipped code, and that deleting or breaking that specific production element makes this assertion red. A guard built against a synthetic fixture or a not-yet-implemented shape proves only that the measurement harness works — it does not guard the regression. If the implementation lands in a later PR, hold the guard until then or point it at the real implementation now.
      source: copilot:PR#254
      added: "2026-09-10"
      paths:
        - scripts/**/*.mjs
    - id: wire-contract-untested-by-json
      category: testing
      pattern: >-
        A new or changed DTO/wire contract (new type, property, or `[JsonPropertyName]`) where the tests construct the object directly in C# rather than deserializing it from a JSON fixture
      check: >-
        Verify a JSON fixture under Testdata/ contains the new member and that a deserialization test asserts every new field — wire name, IDs, parent IDs, names, counts. Tests that new up the DTO in C# pass even when the wire name or field shape is wrong, so they are not evidence the contract matches Munin's JSON.
      source: copilot:PR#250
      added: "2026-09-10"
      paths:
        - src/**/*.cs
    - id: changelog-fragment-grammar
      category: style
      pattern: >-
        Prose in changelog.d/ fragments, XML doc comments, or other release-note text that ships to readers
      check: >-
        Read each sentence of the fragment as written and verify it is grammatical — in particular that omitted relative pronouns ('that', 'which', 'who'), articles, and prepositions are present where the sentence needs them, since these fragments are assembled verbatim into CHANGELOG.md and the package's PackageReleaseNotes with no later editing pass.
      source: copilot:PR#250
      added: "2026-09-10"
      paths:
        - changelog.d/**
        - changelog.d/**/*.md
