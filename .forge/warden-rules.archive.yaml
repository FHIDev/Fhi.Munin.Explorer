    - id: norwegian-term-outside-domain-list
      category: style
      pattern: >-
        Diff-added or diff-edited text — a C# identifier (class, property, local, method, etc.) or a changelog.d/*.md fragment's title/body — uses a Norwegian word or abbreviation that is not one of the repository's approved domain terms from AGENTS.md under "Norwegian stays where it is read, not called"
      check: >-
        Read the canonical list in AGENTS.md before flagging anything — it can drift from any restatement here. Keep kilde, datasamling, delkilde, variabelgruppe, kildetype, kodeverk and its kinds (helsefagligKodeverk, administrativtKodeverk, kildekodeverk), plus the Norwegian collection plurals (kilder/Kilder, delkilder/Delkilder, datasamlinger/Datasamlinger, variabelgrupper/Variabelgrupper, kildetyper/KildeTyper), casing appropriate to context, and — for changelog fragments only — kildeutforsker and variabelutforsker. Everything else must be English; abbreviations such as gruppe for variabelgruppe don't count as approved terms. Only check changelog.d/*.md fragments the diff adds or edits, not standing fragments, and don't flag terms that already ship untouched in CHANGELOG.md.
