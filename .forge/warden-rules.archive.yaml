    - id: pr-body-closes-bead-marker-2
      category: other
      pattern: >-
        PR body references a bead's completion via `Bead: <id>`, a GitHub issue reference (`Closes <owner>/<repo>#N`), or some other non-literal form, instead of the exact `Closes-Bead: <bead-id>` line — or uses `Closes-Bead:` when the work only partially satisfies the bead
      check: >-
        Verify the PR body's bead line matches the actual completion state and format the bead closer requires: a literal, standalone `Closes-Bead: <bead-id>` line only when the diff fully satisfies the bead's acceptance criteria (implementation plus changelog fragment present), and `Bead: <bead-id>` alone for partial work. A GitHub `Closes #N`/`Closes <owner>/<repo>#N` reference does not close a bead (beads aren't GitHub issues), and `Bead:` alone does not close one either — the bead closer matches only on the exact `Closes-Bead:` marker.
      source: [copilot:PR#343, copilot:PR#424]
