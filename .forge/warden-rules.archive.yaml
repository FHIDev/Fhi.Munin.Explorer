rules:
    - id: changelog-fragment-grammar
      category: style
      pattern: Prose in a changelog.d/ fragment, which ships to readers as release-note text
      check: >-
        Read each sentence of the fragment as written and verify it is grammatical — in particular that omitted relative pronouns ('that', 'which', 'who'), articles, and prepositions are present where the sentence needs them, since these fragments are assembled verbatim into CHANGELOG.md and the package's PackageReleaseNotes with no later editing pass.
      source: copilot:PR#250
      added: "2026-09-10"
      paths:
        - changelog.d/**/*.md
      superseded_by: doc-prose-grammar
      last_seen: 2026-09-14T09:48:25.497637042Z
      archived_at: 2026-09-14T09:48:25.497637042Z
      archive_reason: duplicate
    - id: xml-doc-prose-grammar
      category: style
      pattern: >-
        Prose in a public XML doc comment on the package's API — `<summary>`, `<remarks>`, `<param>`
      check: >-
        Read each sentence as written and verify it is grammatical — in particular that omitted relative pronouns ('that', 'which', 'who'), articles, and prepositions are present where the sentence needs them. These ship inside the package and are read in an IDE by someone who has only the package, with no later editing pass, which is the same reason the three-line comment ceiling exempts them: length is theirs to spend, correctness is not.
      source: copilot:PR#250
      added: "2026-09-14"
      paths:
        - src/**/*.cs
      superseded_by: doc-prose-grammar
      last_seen: 2026-09-14T09:48:25.497638009Z
      archived_at: 2026-09-14T09:48:25.497638009Z
      archive_reason: duplicate
    - id: changelog-fragment-english-only
      category: style
      pattern: >-
        A changelog fragment in changelog.d/ contains Norwegian domain terms (e.g. datakategorier, datakategori) instead of English in its title or body
      check: >-
        Verify the title and body of every changelog.d/*.md fragment the diff adds or edits are English-only — standing fragments this PR does not touch are out of scope — translating any Norwegian term the canonical list in AGENTS.md ("Norwegian stays where it is read, not called") does not keep untranslated. That list is kilde, datasamling, delkilde, variabelgruppe, kildetype and kodeverk with the kinds it comes in (helsefagligKodeverk, administrativtKodeverk, kildekodeverk), plus the Norwegian plurals the API uses for their collections — kilder, delkilder, datasamlinger, variabelgrupper, kildetyper. Also untranslated, though AGENTS.md's list does not name them: kildeutforsker and variabelutforsker, this repository's own names for its two views, which ship throughout CHANGELOG.md, AGENTS.md and CLAUDE.md. Read AGENTS.md rather than trusting this restatement of it, which can drift; terms it keeps already ship in CHANGELOG.md and must not be flagged
      source: copilot:PR#302
      added: "2026-09-14"
      paths:
        - changelog.d/**/*.md
      superseded_by: norwegian-term-outside-approved-domain-list
      last_seen: 2026-09-26T14:32:11.01952146Z
      archived_at: 2026-09-26T14:32:11.01952146Z
      archive_reason: duplicate
    - id: norwegian-identifier-not-in-domain-list
      category: style
      pattern: >-
        A new C# identifier (class, property, local, method, etc.) uses a Norwegian word or abbreviation that is not one of the repository's approved closed-list domain terms defined in AGENTS.md under "Norwegian stays where it is read, not called"
      check: >-
        Read the canonical list in AGENTS.md before flagging a name. Keep `kilde`, `datasamling`, `delkilde`, `variabelgruppe`, `kildetype`, `kodeverk`, and its kinds (`helsefagligKodeverk`, `administrativtKodeverk`, `kildekodeverk`), plus the Norwegian collection plurals (`Kilder`, `Delkilder`, `Datasamlinger`, `Variabelgrupper`, `KildeTyper`), with casing appropriate to the identifier. All other identifier words must be English; abbreviations such as `gruppe` instead of `variabelgruppe` are not approved domain terms.
      source: copilot:PR#312
      added: "2026-09-15"
      paths:
        - src/**/*.cs
        - src/**/*.razor
        - test/**/*.cs
        - test/**/*.razor
      superseded_by: norwegian-term-outside-approved-domain-list
      last_seen: 2026-09-26T14:32:11.01952146Z
      archived_at: 2026-09-26T14:32:11.01952146Z
      archive_reason: duplicate
    - id: comment-history-not-incident-history
      category: style
      pattern: >-
        A comment anywhere in the repository — a test, a source or Razor file, a script — explains why the code exists by narrating past states (old counts, prior capture behavior, bead/PR history) instead of stating the current invariant
      check: >-
        Verify the comment states only the present-tense invariant the code enforces; confirm any incident history, counts, or 'used to'/'previously' narrative is removed and belongs in the bead instead. Public XML doc comments on the package's API are the exception, as AGENTS.md's "Comments" section has it: their reader has the package from the feed and its IntelliSense, not this repository, so a migration note they cannot reconstruct from the signature — what a member used to hold before the API resolved it — stays in the file, and the bead it would move to is unreadable to them. Internal types, tests and scripts have no such reader
      source: copilot:PR#302
      added: "2026-09-14"
      paths:
        - scripts/**/*.mjs
        - scripts/**/*.sh
        - src/**/*.cs
        - src/**/*.razor
        - test/**/*.cs
      superseded_by: comment-history-not-incident-history-2
      last_seen: 2026-09-26T14:32:11.01952146Z
      archived_at: 2026-09-26T14:32:11.01952146Z
      archive_reason: duplicate
    - id: comment-ceiling-internal-xml
      category: style
      pattern: >-
        XML doc /// <remarks> (or other XML doc comments) added to an internal/private member that narrate incident history, restate what the code does, or otherwise exceed three lines
      check: >-
        Confirm any comment on non-public API is at most three lines and states only the invariant; move restated-what or incident/bead narrative into the bead or PR description instead of the source
      source: copilot:PR#431
      added: "2026-09-23"
      paths:
        - src/**/*.cs
      superseded_by: comment-history-not-incident-history-2
      last_seen: 2026-09-26T14:32:11.01952146Z
      archived_at: 2026-09-26T14:32:11.01952146Z
      archive_reason: duplicate
    - id: internal-comment-budget
      category: style
      pattern: >-
        An internal (non-XML-doc) code comment exceeds three lines, and/or includes change history or personal attribution (names, dates, 'changed by')
      check: >-
        Verify internal comments are three lines or fewer and contain only the non-obvious why (e.g. an invariant); confirm change history and author attribution are absent and instead live in the bead or PR description
      source: copilot:PR#433
      added: "2026-09-23"
      paths:
        - src/**/*.razor
      superseded_by: comment-three-line-ceiling
      last_seen: 2026-09-29T00:00:00Z
      archived_at: 2026-09-29T00:00:00Z
      archive_reason: duplicate
    - id: test-xml-doc-comment-ceiling
      category: style
      pattern: >-
        XML doc comments on test types/methods (not published API) that exceed three lines, especially ones narrating why tests were moved or restructured
      check: >-
        Verify test-file XML docs stay within the three-line ceiling and contain only the non-obvious why (not history); confirm any historical/rationale detail beyond that is moved to the tracking bead and referenced by ID rather than archived in the comment
      source: copilot:PR#433
      added: "2026-09-23"
      paths:
        - test/**/*.cs
      superseded_by: comment-three-line-ceiling
      last_seen: 2026-09-29T00:00:00Z
      archived_at: 2026-09-29T00:00:00Z
      archive_reason: duplicate
    - id: no-xml-docs-on-internal-members
      category: style
      pattern: >-
        Internal (non-public) helper method, class, or member in src/ has an XML doc comment (/// summary, remarks, etc.), especially a multi-line block
      check: >-
        Confirm the documented member is actually part of the package's public API surface; if it is internal implementation code, the three-line comment ceiling applies and XML doc blocks are not exempt — reduce to a short why-comment (≤3 lines) or remove entirely
      source: copilot:PR#440
      added: "2026-09-23"
      paths:
        - src/**/*.cs
      superseded_by: comment-three-line-ceiling
      last_seen: 2026-09-29T00:00:00Z
      archived_at: 2026-09-29T00:00:00Z
      archive_reason: duplicate
    - id: no-incident-narrative-in-test-remarks
      category: style
      pattern: >-
        A test class or method carries an XML doc /remarks (or similar multi-line comment) explaining the incident or rationale behind why the test exists, exceeding the repository's three-line comment ceiling
      check: >-
        Verify comments in test files stay within the three-line ceiling and contain only the why, not incident history; move longer rationale to the bead or PR description, since test types are not part of the public package API and don't get the XML-docs exception
      source: copilot:PR#440
      added: "2026-09-23"
      paths:
        - test/**/*.cs
      superseded_by: comment-three-line-ceiling
      last_seen: 2026-09-29T00:00:00Z
      archived_at: 2026-09-29T00:00:00Z
      archive_reason: duplicate
    - id: disclosure-control-state-collapsed
      category: correctness
      pattern: >-
        A collection/result field is rendered based only on non-emptiness (e.g. `AnyX` checking row count) before an ordinary-data table/view, without checking for a special sentinel or suppressed state (e.g. statistical disclosure control markers)
      check: >-
        Verify that domain-specific suppressed/sentinel states are detected and rendered distinctly from both 'absent data' and 'ordinary data', and that each such state has its own test
      source: copilot:PR#433
      added: "2026-09-23"
      paths:
        - src/**/*.razor
      superseded_by: disclosure-control-state-not-surfaced
      last_seen: 2026-09-29T00:00:00Z
      archived_at: 2026-09-29T00:00:00Z
      archive_reason: duplicate
    - id: shared-set-across-independent-pools
      category: correctness
      pattern: >-
        A single shared set/collection is used to track membership or 'placed' state across two logically independent pools or namespaces that can have colliding keys
      check: >-
        Verify that when two pools are split for placement/lookup purposes, each pool tracks its own placed/seen keys separately rather than sharing one collection, so a colliding key in one pool cannot cause an item to be incorrectly filtered from the other
      source: copilot:PR#359
      added: "2026-09-21"
      paths:
        - src/**/*.cs
      last_seen: 2026-09-23T14:30:48Z
      archived_at: 2026-09-23T14:30:48Z
      archive_reason: lost-in-force-push
    - id: collision-free-dom-ids-from-open-keys
      category: other
      pattern: >-
        An open-ended or user/curator-supplied key (e.g. a catalogue/config key) is used directly as an HTML element id or anchor target
      check: >-
        Verify the key can't collide with reserved or pre-existing ids (e.g. other static section ids) — either namespace the generated id (prefix/scope it) or reject reserved keys before using them as ids, since duplicate ids make anchors/links resolve to the wrong element
      source: copilot:PR#359
      added: "2026-09-21"
      paths:
        - src/**/*.cs
      last_seen: 2026-09-23T14:30:48Z
      archived_at: 2026-09-23T14:30:48Z
      archive_reason: lost-in-force-push
    - id: prose-claim-matches-implementation
      category: other
      pattern: >-
        A change advertises a general behavior (via changelog, doc comment, or PR description) but the implementation only handles a narrower subset — e.g. some code paths still read state from a source that a stated rename/refactor was supposed to replace
      check: >-
        For every code path covered by the stated claim, confirm the implementation actually reads/applies the new source (not just local defaults or a subset of parameters); if it doesn't, require either fixing the gap or narrowing the published claim to match what the code actually does
      source: copilot:PR#359
      added: "2026-09-21"
      paths:
        - src/**/*.cs
      last_seen: 2026-09-23T14:30:48Z
      archived_at: 2026-09-23T14:30:48Z
      archive_reason: lost-in-force-push
    - id: count-only-fixture-assertion
      category: testing
      pattern: >-
        A test asserts equality of aggregate counts (e.g. row/element totals) before and after a change to fixture or rendered data, especially when the new fixture path adds duplicate or catch-all entries that can pad the count
      check: >-
        Verify the test compares the actual set of facts (labels/values as a multiset or per-key assertions), not just totals — a count match can hide a dropped property masked by duplicated or catch-all rows
      source: copilot:PR#359
      added: "2026-09-21"
      paths:
        - test/**/*.cs
      last_seen: 2026-09-23T14:30:48Z
      archived_at: 2026-09-23T14:30:48Z
      archive_reason: lost-in-force-push
    - id: comment-ceiling-nontrivial-fact
      category: style
      pattern: >-
        A comment on an internal type/member exceeds the three-line ceiling by narrating history, rationale for rejected alternatives, or other background alongside the actual invariant
      check: >-
        Trim the comment to only the non-obvious invariant a future reader needs (e.g. ordering/fallback rules); move historical context, rejected alternatives, or incident narrative out of the code into the bead or PR description
      source: copilot:PR#359
      added: "2026-09-21"
      paths:
        - src/**/*.cs
      last_seen: 2026-09-23T14:30:48Z
      archived_at: 2026-09-23T14:30:48Z
      archive_reason: lost-in-force-push
    - id: comment-doc-exceeds-ceiling
      category: style
      pattern: >-
        A private/internal method or member has an XML doc or comment block that exceeds the three-line ceiling, often including bead/incident history or restating logic recoverable from the implementation
      check: >-
        Verify the comment is three lines or fewer, keeps only non-obvious invariants (e.g. fallback behavior) that aren't derivable from reading the code, and moves any bead history, rationale, or explanation into the bead or PR description instead
      source: copilot:PR#359
      added: "2026-09-21"
      paths:
        - src/**/*.cs
      last_seen: 2026-09-23T14:30:48Z
      archived_at: 2026-09-23T14:30:48Z
      archive_reason: lost-in-force-push
    - id: conditional-section-fixture-mismatch
      category: testing
      pattern: >-
        A test fixture/seed is updated to add a field that triggers a conditional branch (e.g., a value that should create its own dedicated section/group), but the fixture still nests that field inside an existing group instead of its own
      check: >-
        When a task adds a conditional placement rule (field X gets its own section once present), verify the fixture/seed data actually exercises that condition by placing the field in its own dedicated group, and that the corresponding assertion (e.g., heading count/order) covers the resulting section rather than silently passing with fewer sections than intended
      source: copilot:PR#360
      added: "2026-09-21"
      paths:
        - test/**/*.cs
      last_seen: 2026-09-23T14:30:48Z
      archived_at: 2026-09-23T14:30:48Z
      archive_reason: lost-in-force-push
    - id: comment-budget-internal-docs
      category: style
      pattern: >-
        An added or expanded XML doc / comment on an internal helper, record, or type explaining identity, localization, or placement semantics
      check: >-
        Verify the comment does not exceed the repository's three-line comment budget; fold multi-point explanations (identity, invariants, localization, placement distinctions) into a single compact statement of the stable invariant rather than a narrative explanation
      source: copilot:PR#360
      added: "2026-09-21"
      paths:
        - src/**/*.cs
      last_seen: 2026-09-23T14:30:48Z
      archived_at: 2026-09-23T14:30:48Z
      archive_reason: lost-in-force-push
    - id: toc-entry-drops-language-attribute
      category: ui
      pattern: >-
        A value carries a language/locale marker (e.g. `HeadingLanguage`) that is rendered with `lang="..."` in one place (like a section heading), but the same text is also surfaced elsewhere (e.g. a TOC/nav entry, summary, or duplicate label) via a separate model/struct that doesn't carry that marker through
      check: >-
        Verify that every place the same fallback-translated text is rendered carries its language attribute consistently — trace the value from its source through all downstream DTOs/records (e.g. `DetailTocEntry`) to confirm the language field is propagated and applied to the link/label text, not just the primary heading.
      source: copilot:PR#360
      added: "2026-09-21"
      paths:
        - src/**/*.cs
      last_seen: 2026-09-23T14:30:48Z
      archived_at: 2026-09-23T14:30:48Z
      archive_reason: lost-in-force-push
    - id: internal-doc-scope-creep
      category: style
      pattern: >-
        XML doc or comment on an internal/private method narrates implementation steps or history instead of stating the invariant it guarantees
      check: >-
        Confirm internal method documentation is condensed to the invariant or contract the method upholds, with implementation narrative and incident history left out of the source (they belong in the bead/PR description)
      source: copilot:PR#360
      added: "2026-09-21"
      paths:
        - src/**/*.cs
      last_seen: 2026-09-23T14:30:48Z
      archived_at: 2026-09-23T14:30:48Z
      archive_reason: lost-in-force-push
    - id: docs-match-actual-id-derivation
      category: other
      pattern: >-
        Public XML doc or comment describes an id/key/fragment as directly being some source value (e.g. 'the catalogue section key') when the implementation actually transforms it (prefixing, slugifying, numbering) before use
      check: >-
        Verify the doc comment describes what the value actually is after transformation, not the pre-transform source it was derived from, so consumers relying on the documented contract (e.g. URL fragments) aren't misled
      source: copilot:PR#360
      added: "2026-09-21"
      paths:
        - src/**/*.cs
      last_seen: 2026-09-23T14:30:48Z
      archived_at: 2026-09-23T14:30:48Z
      archive_reason: lost-in-force-push
    - id: test-comment-budget
      category: style
      pattern: >-
        A comment block above a test class or test method describes mechanics already exercised by the test body, exceeding the repository's three-line comment ceiling
      check: >-
        Verify the comment states only the invariant being tested (the why), fits within three lines, and does not restate mechanics already visible in the test code
      source: copilot:PR#360
      added: "2026-09-21"
      paths:
        - test/**/*.cs
      last_seen: 2026-09-23T14:30:48Z
      archived_at: 2026-09-23T14:30:48Z
      archive_reason: lost-in-force-push
    - id: fixture-comment-budget
      category: testing
      pattern: >-
        A test fixture or handwritten test-data file carries an XML/doc comment that narrates rationale, history, or context beyond the three-line comment ceiling
      check: >-
        Verify comments on test fixtures state only the observed source and the reason the fixture is handwritten (e.g. stale capture, manual trap), and trim any narrative that exceeds the repository's comment budget
      source: copilot:PR#360
      added: "2026-09-21"
      paths:
        - test/**/*.cs
      last_seen: 2026-09-23T14:30:48Z
      archived_at: 2026-09-23T14:30:48Z
      archive_reason: lost-in-force-push
    - id: norwegian-outside-approved-domain-list
      category: style
      pattern: >-
        New or edited C# identifiers (class, property, local, method, etc.) or changelog.d/*.md fragment titles/bodies added or edited by the diff use a Norwegian word or abbreviation that is not one of the repository's approved closed-list domain terms from AGENTS.md under "Norwegian stays where it is read, not called"
      check: >-
        Read the canonical list in AGENTS.md before flagging anything — it can drift from any restatement here. The approved terms are kilde, datasamling, delkilde, variabelgruppe, kildetype, kodeverk and its kinds (helsefagligKodeverk, administrativtKodeverk, kildekodeverk), plus the Norwegian plurals the API/collections use — kilder, delkilder, datasamlinger, variabelgrupper, kildetyper — each with casing appropriate to context. Also treat kildeutforsker and variabelutforsker as approved even though AGENTS.md's list doesn't name them, since they're this repository's own view names and ship throughout CHANGELOG.md, AGENTS.md and CLAUDE.md. For changelog fragments, only check the title/body of changelog.d/*.md files the diff adds or edits — standing untouched fragments are out of scope, and terms already shipping in CHANGELOG.md must not be flagged. Everything else — new identifiers of any kind, and changelog prose — must be English; abbreviations or partial forms of an approved term (e.g. gruppe for variabelgruppe) are not themselves approved.
      source: [copilot:PR#302, copilot:PR#312]
      added: "2026-09-15"
      paths:
        - changelog.d/**/*.md
        - src/**/*.cs
        - src/**/*.razor
        - test/**/*.cs
        - test/**/*.razor
      merged_at: "2026-09-22"
      last_seen: 2026-09-23T14:30:48Z
      archived_at: 2026-09-23T14:30:48Z
      archive_reason: lost-in-force-push
    - id: restored-sort-visibility-flag-conflated-with-filter-flag
      category: other
      pattern: >-
        Restoring a sort/state on a hidden or filtered UI element by setting the same boolean flag that a separate filter or reader-choice control also reads to decide visibility
      check: >-
        Verify that a flag set to reveal an element for one reason (e.g. a restored sort) is distinct from the flag that a filter or user choice later uses to hide it, so toggling the filter still hides the element even after the sort-triggered reveal
      source: copilot:PR#413
      added: "2026-09-23"
      paths:
        - src/**/*.cs
      last_seen: 2026-09-26T14:32:14Z
      archived_at: 2026-09-26T14:32:14Z
      archive_reason: lost-in-force-push
    - id: rollback-notify-all-changed-props
      category: concurrency
      pattern: >-
        A stale-response guard rolls back multiple related fields (e.g. Sort and Direction) that changed together in a single request, but only raises a changed-notification for one of them
      check: >-
        When rolling back a superseded async request, verify every field that could have changed relative to the rolled-back value fires its own changed-notification/callback, not just the first or most obvious one
      source: copilot:PR#413
      added: "2026-09-23"
      paths:
        - src/**/*.cs
      last_seen: 2026-09-26T14:32:14Z
      archived_at: 2026-09-26T14:32:14Z
      archive_reason: lost-in-force-push
    - id: test-identifier-uses-wire-name-not-english
      category: testing
      pattern: >-
        A test identifier (method name, variable, local) borrows a JSON wire-name spelling (e.g. a Norwegian field name from the payload) instead of the model's English property name
      check: >-
        Confirm test identifiers use the model's English name and reserve the wire spelling for the JSON payload literal itself, consistent with the repository's English-identifiers convention (Norwegian reserved for user-facing strings and established domain terms)
      source: copilot:PR#415
      added: "2026-09-23"
      paths:
        - test/**/*.cs
      last_seen: 2026-09-26T14:32:14Z
      archived_at: 2026-09-26T14:32:14Z
      archive_reason: lost-in-force-push
    - id: activate-shared-state-before-write-completes
      category: concurrency
      pattern: >-
        Async operation switches a shared/observable state (e.g. active list, selected item) to a new target before the writes that populate that target have completed, while other components read/write through the same shared state
      check: >-
        Verify shared state is only pointed at the new target after all its writes finish, so concurrent readers/writers cannot observe or mutate a partially-populated target during the intervening awaits
      source: copilot:PR#424
      added: "2026-09-23"
      paths:
        - src/**/*.cs
      last_seen: 2026-09-26T14:32:14Z
      archived_at: 2026-09-26T14:32:14Z
      archive_reason: lost-in-force-push
    - id: distinguish-missing-vs-empty-result
      category: error-handling
      pattern: >-
        A downstream call collapses a semantically distinct 'not found'/'missing' response (e.g. null) into a generic empty collection/page before the caller uses it for a mutating operation (create/copy/write)
      check: >-
        Verify the caller can still distinguish 'source no longer exists' from 'source exists but is legitimately empty' at the point of the mutating call, especially when time has passed (e.g. another read) since the last validation — don't let an intermediate conversion silently normalize a missing/deleted result into a valid empty one
      source: copilot:PR#424
      added: "2026-09-23"
      paths:
        - src/**/*.cs
      last_seen: 2026-09-26T14:32:14Z
      archived_at: 2026-09-26T14:32:14Z
      archive_reason: lost-in-force-push
    - id: batch-partial-failure-test-coverage
      category: testing
      pattern: >-
        A test asserts partial-failure/partial-success behavior for batched or chunked operations (e.g. 'earlier batches succeed, a later batch fails')
      check: >-
        Verify the test data actually spans multiple batches — enough items to force at least two chunks, with the fake/mock configured to succeed on an earlier chunk and fail on a later one — rather than having a single chunk fail on its first and only call, which never exercises the partial-completion path the assertion claims to cover.
      source: copilot:PR#424
      added: "2026-09-23"
      paths:
        - test/**/*.cs
      last_seen: 2026-09-26T14:32:14Z
      archived_at: 2026-09-26T14:32:14Z
      archive_reason: lost-in-force-push
    - id: no-oversized-private-doc-comments
      category: style
      pattern: >-
        A private/internal method's doc comment exceeds the repository's three-line ceiling (only public package API XML docs are exempt)
      check: >-
        Confirm internal comments are at most 3 lines and state only the operation and any non-obvious invariant, with historical rationale moved to the bead instead of the code
      source: copilot:PR#424
      added: "2026-09-23"
      paths:
        - src/**/*.cs
      last_seen: 2026-09-26T14:32:14Z
