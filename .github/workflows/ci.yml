name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: write # sticky build-summary comment on same-repo PRs

concurrency:
  # One run per branch; a new push cancels the in-flight run for the same ref.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build + test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Cache NuGet
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Build.props') }}
          restore-keys: nuget-${{ runner.os }}-

      # Each phase records its own outcome and duration so the PR comment can show
      # which one failed rather than just "the build broke". continue-on-error keeps
      # later phases running so the table is complete; the gate step at the end is
      # what actually fails the job.
      - name: Restore
        id: restore
        continue-on-error: true
        run: |
          S=$SECONDS
          dotnet restore
          echo "RESTORE_DUR=$((SECONDS-S))s" >> "$GITHUB_ENV"

      - name: Build
        id: build
        continue-on-error: true
        run: |
          S=$SECONDS
          # TreatWarningsAsErrors is set in Directory.Build.props, so a new warning
          # fails here — as does the RCL's banned-API guard (RS0030).
          dotnet build --configuration Release --no-restore
          echo "BUILD_DUR=$((SECONDS-S))s" >> "$GITHUB_ENV"

      - name: Test
        id: test
        continue-on-error: true
        run: |
          S=$SECONDS
          # --verbosity quiet also swallows a failed test's message and stack, which left four red
          # runs to be told apart from a real defect by the test's name alone (Fhi.Metadata-yvldl).
          # minimal prints them for 40 lines on a green run, where normal names all 1135 for 1184.
          dotnet test --configuration Release --no-build --verbosity quiet \
            --logger 'console;verbosity=minimal'
          echo "TEST_DUR=$((SECONDS-S))s" >> "$GITHUB_ENV"

      - name: Format
        id: format
        continue-on-error: true
        run: |
          S=$SECONDS
          # .editorconfig is Munin's, so the two codebases read the same way.
          # .gitattributes forces LF in the working tree, which keeps this agreeing
          # between a Linux runner and a Windows checkout.
          dotnet format --verify-no-changes
          echo "FORMAT_DUR=$((SECONDS-S))s" >> "$GITHUB_ENV"

      - name: Pack
        id: pack
        continue-on-error: true
        run: |
          S=$SECONDS
          # Packaging is the deliverable and a publish to the feed cannot be walked back,
          # so prove the package still builds on every change, not just at tag time.
          dotnet pack --configuration Release --no-build --output artifacts
          # Same check the release workflow runs before pushing. Here it is only red on a PR;
          # there it is the difference between a correct package and a permanent one. Finding
          # out on the PR that added the stray file is the cheap end of that.
          ./scripts/assert-package-contents.sh artifacts
          echo "PACK_DUR=$((SECONDS-S))s" >> "$GITHUB_ENV"

      - name: Summary
        if: always()
        run: |
          to_emoji() { case "$1" in success) echo "✅";; failure) echo "❌";; skipped) echo "⏭️";; *) echo "❔";; esac; }
          badge() { case "$1" in success) echo "✅";; *) echo "❌";; esac; }

          R='${{ steps.restore.outcome }}'; B='${{ steps.build.outcome }}'
          T='${{ steps.test.outcome }}';    P='${{ steps.pack.outcome }}'
          F='${{ steps.format.outcome }}'

          FILE=pr-summary.md
          {
            echo "### Status: Build $(badge "$B") · Test $(badge "$T") · Format $(badge "$F") · Pack $(badge "$P")"
            echo ""
            echo "| Step    | Outcome | Duration |"
            echo "|---------|---------|----------|"
            echo "| restore | $(to_emoji "$R") $R | ${RESTORE_DUR:-—} |"
            echo "| build   | $(to_emoji "$B") $B | ${BUILD_DUR:-—} |"
            echo "| test    | $(to_emoji "$T") $T | ${TEST_DUR:-—} |"
            echo "| format  | $(to_emoji "$F") $F | ${FORMAT_DUR:-—} |"
            echo "| pack    | $(to_emoji "$P") $P | ${PACK_DUR:-—} |"
            echo ""
            if compgen -G "artifacts/*.nupkg" > /dev/null; then
              echo "**Packages**"
              echo ""
              for f in artifacts/*.nupkg; do echo "- \`$(basename "$f")\`"; done
              echo ""
            fi
            echo "**Run:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          } | tee "$FILE" >> "$GITHUB_STEP_SUMMARY"

      # The comment is posted by "ci summary" instead, which is the only job that can see the
      # guards' results. This hands it the step detail; it owns the same build-summary header.
      - name: Upload summary for the report job
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pr-summary
          path: pr-summary.md
          if-no-files-found: ignore
          retention-days: 1

      - name: Upload packages
        if: steps.pack.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: nupkg
          path: artifacts/*.nupkg
          if-no-files-found: ignore
          retention-days: 14

      # continue-on-error above means the job would otherwise report success even
      # when a phase failed. This is what actually fails it.
      - name: Gate
        if: always()
        run: |
          fail=0
          for s in '${{ steps.restore.outcome }}' '${{ steps.build.outcome }}' \
                   '${{ steps.test.outcome }}' '${{ steps.format.outcome }}' \
                   '${{ steps.pack.outcome }}'; do
            [ "$s" = "success" ] || fail=1
          done
          [ "$fail" = "0" ] || { echo "::error::One or more build phases failed — see the summary table."; exit 1; }

  # Changelog fragments. CHANGELOG.md is a single file every branch wants to edit on the same
  # few lines — the most reliable merge conflict there is — so changes are recorded one file
  # per change under changelog.d/ and folded in at release time. That only works if the
  # fragments get written, which is what this job is for.
  #
  # A separate job, not a step in "build + test": a missing changelog is not a broken build.
  #
  # This job's name is one of the six required status checks on main (2026-08-28), so renaming it
  # silently stops gating anything — the check it names simply never reports again.
  changelog:
    name: changelog fragment
    # Dependabot touches src/**/*.csproj on every bump and ships its own changelog, and
    # [no-changelog] in the title is the escape hatch for the mechanical src/ change that has
    # nothing to tell a host. It sits in the PR title where a reviewer sees it.
    if: >-
      github.event_name == 'pull_request'
      && github.event.pull_request.user.login != 'dependabot[bot]'
      && !contains(github.event.pull_request.title, '[no-changelog]')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          # The check diffs against the merge base, so it needs both sides of the history.
          fetch-depth: 0

      - name: Require a changelog fragment for src/ changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        # The same script developers can run locally before pushing, so a red check here is
        # never a surprise that only CI knows how to reproduce.
        run: ./scripts/check-changelog-fragment.sh "$BASE_SHA" "$HEAD_SHA"

  # The two sample hosts share one stylesheet, copied. Nothing about a build notices when the
  # copies stop agreeing — the drift shows up as a component that looks broken in one sample and
  # fine in the other, which is the reading it least deserves. Nor does anything notice when both
  # copies are missing the same rules, which looks broken in both. The script checks for each in
  # turn; see its header.
  #
  # Its own job, like the changelog check and for the same reason: sample CSS drift is not a
  # broken build. Required on main since 2026-08-28 — a drifted PR now blocks rather than merging
  # red, which is what the script header and the README always implied. Renaming this job removes
  # the gate without removing the check that appears to enforce it.
  sample-css:
    name: sample stylesheets in step
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Assert the sample hosts' stylesheets are identical and complete
        # The same script developers can run locally before pushing, so a red check here is
        # never a surprise that only CI knows how to reproduce.
        run: ./scripts/assert-sample-css-in-step.sh

  # A class name new on this branch has to be written down for whoever updates Fhi.Helsedata.Stiler,
  # which lives in Azure DevOps and is unreachable from here. The sample-css job above compares
  # against the SAMPLE stylesheets — the most it can reach — so it goes green while the real site has
  # no rule at all. That shipped three times in two days before this check existed.
  #
  # fetch-depth: 0 because this is a diff against the base branch: without it there is no base to
  # compare against and the script exits 2 rather than guessing.
  host-notes:
    name: host notes for new names
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Assert new class names are noted for hosts
        env:
          BASE_REF: origin/${{ github.base_ref || github.event.repository.default_branch }}
        run: |
          git fetch --quiet origin "${BASE_REF#origin/}"
          ./scripts/assert-new-names-noted-for-hosts.sh

  # The host-notes job above is a diff against the base branch, so it only ever asks about names
  # that are new here. A name already missing when it was written stays missing however many
  # branches pass it — which is how the README came to promise "the nine munin-explorer-kilde*
  # names" over twelve of them, and how the eight munin-explorer-whole* names reached no markdown
  # file at all. This job has no window: it reconciles the whole prefix against the README's
  # inventory table, both directions, every run.
  #
  # No fetch-depth: nothing here reads history. Its own job for the same reason as the two above —
  # an incomplete README is not a broken build.
  class-names:
    name: class names listed in the README
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Assert the README lists every class name the package emits
        run: ./scripts/assert-class-names-listed.sh

  # The README is one of the two places a host reads; the changelog's Notes for hosts section is the
  # other, and the host-notes job's window misses it the same way. The facet panel's two names
  # arrived in #72 stating their own host requirement in an Added bullet, and the branch check
  # landed in #96 — never new on a branch it could see. This job has no window either: every queued
  # fragment, every run.
  #
  # No fetch-depth: nothing here reads history. Its own job for the same reason as the three above.
  fragment-host-notes:
    name: fragment names noted for hosts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Assert every class name a fragment names is noted for hosts
        run: ./scripts/assert-fragment-names-noted-for-hosts.sh

  # BannedSymbols.txt is the only thing keeping host-specific types out of a component that has to
  # render in two hosts, and it is wired up by a condition on the RCL's project name. That
  # condition was stale for the whole time the merged project had a different name than it named:
  # no analyzer, no RS0030, every build green. A guard that fails open cannot report its own
  # absence, so the guard gets a check of its own.
  #
  # Its own job for the same reason as the two above, and required on main since 2026-08-28: a
  # guard that fails open is worth little if the check reporting it cannot block a merge either.
  portability-guard:
    name: portability guard armed
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Cache NuGet
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Build.props') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Assert a banned symbol still fails the RCL build
        # The same script developers can run locally before pushing, so a red check here is
        # never a surprise that only CI knows how to reproduce.
        run: ./scripts/assert-portability-guard-armed.sh

  # The URL-state components exist so a host writes no glue, and both sample hosts prove that
  # badly: they compile against src/, so a type the package does not actually export or a parameter
  # that only exists on this branch look fine in them and fail on someone else's build server. This
  # job packs the package and builds a throwaway project that has a PackageReference and nothing
  # else. Its own job because it packs, which the build job's own pack step does not cover — that
  # one asks what is in the package, this one asks whether a stranger can use it.
  consumer:
    name: a host needs no glue
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Cache NuGet
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Build.props') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Assert the components mount from the package alone
        # The same script developers can run locally before pushing, so a red check here is
        # never a surprise that only CI knows how to reproduce.
        run: ./scripts/assert-host-needs-no-glue.sh

  # WCAG 2.1 AA applies to this package by law, and this job keeps AGENTS.md's accessibility
  # section - the gate's blind spots included - from being a sentence nobody checks. Its own job,
  # required on main since 2026-08-28, for the guards' reasons above.
  accessibility:
    name: accessibility
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Cache NuGet
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Build.props') }}
          restore-keys: nuget-${{ runner.os }}-

      # Playwright brings its own browser; without a cache that is a download per run.
      - name: Cache the scanner's browser
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('scripts/check-accessibility.sh') }}
          restore-keys: playwright-${{ runner.os }}-

      - name: Scan the sample host with axe
        # The same script developers can run locally before pushing, so a red check here is
        # never a surprise that only CI knows how to reproduce.
        run: ./scripts/check-accessibility.sh

  # The same component inside helsedata's REAL stylesheet, with their header positioned over the
  # top of document flow, measured with getBoundingClientRect. The accessibility job above scans
  # ModernHost, whose stylesheet is a hand-written stand-in; on 2026-09-03 four layout defects
  # passed 1317 unit tests and eight axe states there, and two of the four were collisions with
  # rules only Fhi.Helsedata.Stiler has. axe was green through every one. (Fhi.Metadata-l9l2n.40)
  #
  # NEEDS A SECRET, and says so and stops rather than failing without one. AZURE_ARTIFACTS_PAT must
  # be a repository secret holding an Azure DevOps PAT with Packaging (read) on the fhi
  # organisation; samples/HostileHost has a PackageReference to Fhi.Helsedata.Stiler, which lives
  # on helsedata's private feed. Nothing else in this repository touches that feed — nuget.config's
  # packageSourceMapping is what keeps it that way — so every other job here is unaffected either
  # way. Provisioning the secret is the whole of turning this job on.
  #
  # The absence is detected in a STEP and not in the job's `if:`, because the `secrets` context is
  # not available to a job-level condition. `if: secrets.X != ''` there is not a stricter check
  # that happens to be unavailable — it evaluates to false and the job never runs at all, secret
  # or no secret, which is the silent version of exactly what this job exists to prevent.
  #
  # NOT YET IN report's needs: BELOW, AND THAT IS DELIBERATE. It is red on main today, for two
  # defects it found on its first run and neither of which can be fixed from this repository:
  # Fhi.Metadata-l9l2n.41 (Stiler collapses every result row to zero height below 1280px) and
  # Fhi.Metadata-l9l2n.42 (Stiler has no rule for the desiredData column, so the annotation field
  # is a 17px sliver). When those land in Fhi.Helsedata.Stiler and this goes green, add
  # "hostile-layout" to report's needs: and to its table, and require it in branch protection —
  # the same three steps the other guards went through on 2026-08-28.
  hostile-layout:
    name: layout in helsedata's stylesheet
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      # The credential the private feed needs. It goes in the environment and not in a build
      # argument, which persists in image history — the same rule that makes a container build of
      # this host pass it as a BuildKit secret.
      #
      # NOTHING IN NUGET READS THIS VARIABLE. It is read by the Azure Artifacts Credential
      # Provider, a separate plugin, which the next step installs because a GitHub-hosted runner
      # does not have one. Without the plugin the credential sits in the environment with nothing
      # to consume it, the restore falls back to anonymous, and the feed answers NU1301 — which
      # reads like a missing package rather than a missing plugin. This job spent its first real
      # run failing exactly that way, and it passed locally throughout, because the developer
      # machine had the provider installed for helsedata's own restore. A local success proves the
      # PAT and the feed URL and says nothing at all about the runner.
      - name: Authenticate to helsedata's feed
        id: feed
        env:
          FEED: https://pkgs.dev.azure.com/fhi/Fhi.Helsedata/_packaging/Fhi.Helsedata.no/nuget/v3/index.json
          PAT: ${{ secrets.AZURE_ARTIFACTS_PAT }}
        run: |
          if [ -z "$PAT" ]; then
            echo "::notice::AZURE_ARTIFACTS_PAT is not set, so this job has measured nothing."
            echo "have_pat=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Written to the environment file rather than echoed, so the value never reaches a log.
          printf 'VSS_NUGET_EXTERNAL_FEED_ENDPOINTS={"endpointCredentials":[{"endpoint":"%s","username":"github","password":"%s"}]}\n' "$FEED" "$PAT" >> "$GITHUB_ENV"
          echo "have_pat=true" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-dotnet@v6
        if: steps.feed.outputs.have_pat == 'true'
        with:
          global-json-file: global.json

      # The plugin that consumes VSS_NUGET_EXTERNAL_FEED_ENDPOINTS. Not present on a
      # GitHub-hosted runner, and NuGet does not complain about its absence: it simply restores
      # anonymously.
      #
      # A FAILURE HERE IS A FAILURE, NEVER A SKIP. The step above skips this whole job when the
      # secret is absent, which is right — an unconfigured guard should say so and stop. This is
      # the opposite case: the secret IS configured and the toolchain cannot use it. Letting that
      # degrade into the same quiet skip would leave the job green having measured nothing, which
      # is worse than the red it replaces and is the exact failure this job exists to end.
      - name: Install the Azure Artifacts credential provider
        if: steps.feed.outputs.have_pat == 'true'
        env:
          # Pinned, for the reason check-accessibility.sh pins Playwright: an unpinned installer
          # resolves to whatever is newest on the day, which turns an unrelated PR red for a reason
          # nobody changed. 2.0.4 publishes a linux-x64 asset and is what this was written against.
          AZURE_ARTIFACTS_CREDENTIAL_PROVIDER_VERSION: 2.0.4
        run: |
          set -euo pipefail
          sh -c "$(curl -fsSL https://aka.ms/install-artifacts-credprovider.sh)"

          # Asserted, not assumed. A failed download leaves `$(curl ...)` empty and `sh -c ""`
          # exits 0, so without this the step passes having installed nothing — which is the
          # shape of the bug it is here to prevent, one layer up.
          plugin="$HOME/.nuget/plugins/netcore/CredentialProvider.Microsoft/CredentialProvider.Microsoft.dll"
          if [ ! -f "$plugin" ]; then
            echo "::error::The credential provider did not install. The PAT is present and unusable;"
            echo "::error::a restore would fall back to anonymous and report NU1301, which reads"
            echo "::error::like a missing package rather than a missing plugin."
            exit 1
          fi

          # The plugin ships self-contained — its runtimeconfig declares an includedFrameworks
          # entry for Microsoft.NETCore.App — so it does not need a runtime matching global.json's
          # SDK. An NU1301 AFTER this step is the PAT or the feed, never the plugin.
          echo "credential provider present at $plugin"

      # A cache slot of its OWN, and the prefix is the whole point. Every other job here keys on
      # `nuget-<os>-<hash>`, and this is the only job that restores Fhi.Helsedata.Stiler. Sharing
      # that slot would write a private package into a cache saved on the default branch, which any
      # later run may restore — a fork PR's `build` job, which gets no secrets, included. NuGet
      # reads the global-packages folder before it asks a source for credentials, so the PAT that
      # gates this job would end up gating nothing at all.
      - name: Cache NuGet
        if: steps.feed.outputs.have_pat == 'true'
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-hostile-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Build.props') }}
          restore-keys: nuget-hostile-${{ runner.os }}-

      - name: Cache the scanner's browser
        if: steps.feed.outputs.have_pat == 'true'
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('scripts/check-hostile-host.sh') }}
          restore-keys: playwright-${{ runner.os }}-

      # A step of its own so the private-feed restore has a name. Folded into the script below it
      # is where NU1301 was found the hard way: the script starts a stub, starts a host, and only
      # then restores, so the credential failure surfaced as a host that never answered.
      - name: Restore HostileHost against the private feed
        if: steps.feed.outputs.have_pat == 'true'
        run: |
          set -euo pipefail
          dotnet restore samples/HostileHost/HostileHost.csproj

          # The package has to be the real one. A restore can succeed against a cache, so this
          # asks the file on disk rather than the exit code, and asks for a rule no stand-in has.
          css="$HOME/.nuget/packages/fhi.helsedata.stiler/0.1.37/staticwebassets/css/main.css"
          if [ ! -f "$css" ] || ! grep -q 'grid-template-columns: 384px' "$css"; then
            echo "::error::Fhi.Helsedata.Stiler 0.1.37 did not restore, or is not the real stylesheet."
            exit 1
          fi
          echo "Fhi.Helsedata.Stiler 0.1.37 restored, $(wc -c < "$css") bytes of it."

      - name: Measure the component inside helsedata's stylesheet
        if: steps.feed.outputs.have_pat == 'true'
        # The same script developers can run locally before pushing, so a red check here is
        # never a surprise that only CI knows how to reproduce.
        run: ./scripts/check-hostile-host.sh

  # A step reads steps.<id>.outcome, which is job-local, so the summary inside "build + test"
  # could only ever report itself and the four guards were never in the comment. A job added to
  # this workflow must be added to needs: below and to the table, or it stays invisible here.
  report:
    name: ci summary
    needs: [build, changelog, sample-css, host-notes, class-names, fragment-host-notes, portability-guard, consumer, accessibility]
    # It exists to report failed and skipped jobs, so it must not be skipped by one.
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # This job fails when any job in the table did (see the last step). That is what makes it worth
    # requiring: every job is already in needs: above, so a NEW job is gated the moment it is added
    # here — no second trip to branch protection, which is where the guards above spent months.
    #
    # It reported the failure without adopting it until 2026-08-28: the heading said "one or more
    # jobs failed" and the job still exited 0, so requiring it would have gated nothing.
    steps:
      - name: Download the build job's step detail
        # Absent when build never reached its Summary step; the job table still posts without it.
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: pr-summary

      - name: Summary
        id: summary
        run: |
          to_emoji() { case "$1" in success) echo "✅";; failure) echo "❌";; cancelled) echo "🚫";; skipped) echo "⏭️";; *) echo "❔";; esac; }

          # Heredoc, not a pipe: a pipe runs the loop in a subshell and every bad=1 is discarded,
          # so a red job would print in the table and still be headlined as a pass.
          rows=""
          bad=0
          while IFS='|' read -r name result; do
            [ -n "$name" ] || continue
            case "$result" in success|skipped) ;; *) bad=1 ;; esac
            rows="$rows| $name | $(to_emoji "$result") $result |"$'\n'
          done <<EOF
          build + test|${{ needs.build.result }}
          changelog fragment|${{ needs.changelog.result }}
          sample stylesheets in step|${{ needs['sample-css'].result }}
          host notes for new names|${{ needs['host-notes'].result }}
          class names listed in the README|${{ needs['class-names'].result }}
          fragment names noted for hosts|${{ needs['fragment-host-notes'].result }}
          portability guard armed|${{ needs['portability-guard'].result }}
          a host needs no glue|${{ needs.consumer.result }}
          accessibility|${{ needs.accessibility.result }}
          EOF

          FILE=ci-summary.md
          {
            if [ "$bad" = "0" ]; then
              echo "## CI ✅ every job passed"
            else
              echo "## CI ❌ one or more jobs failed"
            fi
            echo ""
            echo "| Job | Result |"
            echo "|-----|--------|"
            printf '%s' "$rows"
            echo ""

            if [ -f pr-summary.md ]; then
              cat pr-summary.md
            else
              echo "_No step detail from \`build + test\` for this run._"
              echo ""
              echo "**Run:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            fi
          } | tee "$FILE" >> "$GITHUB_STEP_SUMMARY"

          # Carried out of the step so the last one can fail on it, after the comment has posted.
          echo "bad=$bad" >> "$GITHUB_OUTPUT"

      - name: Comment summary on PR
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          header: build-summary
          path: ci-summary.md

      - name: Fail if any job in the table failed
        # Last on purpose. Failing earlier would skip the comment step, so the run that most needs
        # a summary would be the one without one.
        if: steps.summary.outputs.bad == '1'
        run: |
          echo "::error::One or more jobs failed — see the table in the run summary." >&2
          exit 1
