name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: write # sticky build-summary comment on same-repo PRs

concurrency:
  # One run per branch; a new push cancels the in-flight run for the same ref.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build + test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Cache NuGet
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Build.props') }}
          restore-keys: nuget-${{ runner.os }}-

      # Each phase records its own outcome and duration so the PR comment can show
      # which one failed rather than just "the build broke". continue-on-error keeps
      # later phases running so the table is complete; the gate step at the end is
      # what actually fails the job.
      - name: Restore
        id: restore
        continue-on-error: true
        run: |
          S=$SECONDS
          dotnet restore
          echo "RESTORE_DUR=$((SECONDS-S))s" >> "$GITHUB_ENV"

      - name: Build
        id: build
        continue-on-error: true
        run: |
          S=$SECONDS
          # TreatWarningsAsErrors is set in Directory.Build.props, so a new warning
          # fails here — as does the RCL's banned-API guard (RS0030).
          dotnet build --configuration Release --no-restore
          echo "BUILD_DUR=$((SECONDS-S))s" >> "$GITHUB_ENV"

      - name: Test
        id: test
        continue-on-error: true
        run: |
          S=$SECONDS
          dotnet test --configuration Release --no-build --verbosity quiet
          echo "TEST_DUR=$((SECONDS-S))s" >> "$GITHUB_ENV"

      - name: Format
        id: format
        continue-on-error: true
        run: |
          S=$SECONDS
          # .editorconfig is Munin's, so the two codebases read the same way.
          # .gitattributes forces LF in the working tree, which keeps this agreeing
          # between a Linux runner and a Windows checkout.
          dotnet format --verify-no-changes
          echo "FORMAT_DUR=$((SECONDS-S))s" >> "$GITHUB_ENV"

      - name: Pack
        id: pack
        continue-on-error: true
        run: |
          S=$SECONDS
          # Packaging is the deliverable and a nuget.org publish cannot be undone,
          # so prove the package still builds on every change, not just at tag time.
          dotnet pack --configuration Release --no-build --output artifacts
          echo "PACK_DUR=$((SECONDS-S))s" >> "$GITHUB_ENV"

      - name: Summary
        if: always()
        run: |
          to_emoji() { case "$1" in success) echo "✅";; failure) echo "❌";; skipped) echo "⏭️";; *) echo "❔";; esac; }
          badge() { case "$1" in success) echo "✅";; *) echo "❌";; esac; }

          R='${{ steps.restore.outcome }}'; B='${{ steps.build.outcome }}'
          T='${{ steps.test.outcome }}';    P='${{ steps.pack.outcome }}'
          F='${{ steps.format.outcome }}'

          FILE=pr-summary.md
          {
            echo "### Status: Build $(badge "$B") · Test $(badge "$T") · Format $(badge "$F") · Pack $(badge "$P")"
            echo ""
            echo "| Step    | Outcome | Duration |"
            echo "|---------|---------|----------|"
            echo "| restore | $(to_emoji "$R") $R | ${RESTORE_DUR:-—} |"
            echo "| build   | $(to_emoji "$B") $B | ${BUILD_DUR:-—} |"
            echo "| test    | $(to_emoji "$T") $T | ${TEST_DUR:-—} |"
            echo "| format  | $(to_emoji "$F") $F | ${FORMAT_DUR:-—} |"
            echo "| pack    | $(to_emoji "$P") $P | ${PACK_DUR:-—} |"
            echo ""
            if compgen -G "artifacts/*.nupkg" > /dev/null; then
              echo "**Packages**"
              echo ""
              for f in artifacts/*.nupkg; do echo "- \`$(basename "$f")\`"; done
              echo ""
            fi
            echo "**Run:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          } | tee "$FILE" >> "$GITHUB_STEP_SUMMARY"

      - name: Comment summary on PR
        if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          header: build-summary
          path: pr-summary.md

      - name: Upload packages
        if: steps.pack.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: nupkg
          path: artifacts/*.nupkg
          if-no-files-found: ignore
          retention-days: 14

      # continue-on-error above means the job would otherwise report success even
      # when a phase failed. This is what actually fails it.
      - name: Gate
        if: always()
        run: |
          fail=0
          for s in '${{ steps.restore.outcome }}' '${{ steps.build.outcome }}' \
                   '${{ steps.test.outcome }}' '${{ steps.format.outcome }}' \
                   '${{ steps.pack.outcome }}'; do
            [ "$s" = "success" ] || fail=1
          done
          [ "$fail" = "0" ] || { echo "::error::One or more build phases failed — see the summary table."; exit 1; }

  # Changelog fragments. CHANGELOG.md is a single file every branch wants to edit on the same
  # few lines — the most reliable merge conflict there is — so changes are recorded one file
  # per change under changelog.d/ and folded in at release time. That only works if the
  # fragments get written, which is what this job is for.
  #
  # A separate job, not a step in "build + test": that job's name is a required status check
  # and renaming it breaks branch protection, and a missing changelog is not a broken build.
  # For this to *block* a merge rather than just show red, add "changelog fragment" to the
  # branch-protection required checks.
  changelog:
    name: changelog fragment
    # Dependabot touches src/**/*.csproj on every bump and ships its own changelog, and
    # [no-changelog] in the title is the escape hatch for the mechanical src/ change that has
    # nothing to tell a host. It sits in the PR title where a reviewer sees it.
    if: >-
      github.event_name == 'pull_request'
      && github.event.pull_request.user.login != 'dependabot[bot]'
      && !contains(github.event.pull_request.title, '[no-changelog]')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          # The check diffs against the merge base, so it needs both sides of the history.
          fetch-depth: 0

      - name: Require a changelog fragment for src/ changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        # The same script developers can run locally before pushing, so a red check here is
        # never a surprise that only CI knows how to reproduce.
        run: ./scripts/check-changelog-fragment.sh "$BASE_SHA" "$HEAD_SHA"
