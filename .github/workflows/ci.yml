name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: write # sticky build-summary comment on same-repo PRs

concurrency:
  # One run per branch; a new push cancels the in-flight run for the same ref.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build + test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Cache NuGet
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Build.props') }}
          restore-keys: nuget-${{ runner.os }}-

      # Each phase records its own outcome and duration so the PR comment can show
      # which one failed rather than just "the build broke". continue-on-error keeps
      # later phases running so the table is complete; the gate step at the end is
      # what actually fails the job.
      - name: Restore
        id: restore
        continue-on-error: true
        run: |
          S=$SECONDS
          dotnet restore
          echo "RESTORE_DUR=$((SECONDS-S))s" >> "$GITHUB_ENV"

      - name: Build
        id: build
        continue-on-error: true
        run: |
          S=$SECONDS
          # TreatWarningsAsErrors is set in Directory.Build.props, so a new warning
          # fails here — as does the RCL's banned-API guard (RS0030).
          dotnet build --configuration Release --no-restore
          echo "BUILD_DUR=$((SECONDS-S))s" >> "$GITHUB_ENV"

      - name: Test
        id: test
        continue-on-error: true
        run: |
          S=$SECONDS
          dotnet test --configuration Release --no-build --verbosity quiet
          echo "TEST_DUR=$((SECONDS-S))s" >> "$GITHUB_ENV"

      - name: Format
        id: format
        continue-on-error: true
        run: |
          S=$SECONDS
          # .editorconfig is Munin's, so the two codebases read the same way.
          # .gitattributes forces LF in the working tree, which keeps this agreeing
          # between a Linux runner and a Windows checkout.
          dotnet format --verify-no-changes
          echo "FORMAT_DUR=$((SECONDS-S))s" >> "$GITHUB_ENV"

      - name: Pack
        id: pack
        continue-on-error: true
        run: |
          S=$SECONDS
          # Packaging is the deliverable and a publish to the feed cannot be walked back,
          # so prove the package still builds on every change, not just at tag time.
          dotnet pack --configuration Release --no-build --output artifacts
          # Same check the release workflow runs before pushing. Here it is only red on a PR;
          # there it is the difference between a correct package and a permanent one. Finding
          # out on the PR that added the stray file is the cheap end of that.
          ./scripts/assert-package-contents.sh artifacts
          echo "PACK_DUR=$((SECONDS-S))s" >> "$GITHUB_ENV"

      - name: Summary
        if: always()
        run: |
          to_emoji() { case "$1" in success) echo "✅";; failure) echo "❌";; skipped) echo "⏭️";; *) echo "❔";; esac; }
          badge() { case "$1" in success) echo "✅";; *) echo "❌";; esac; }

          R='${{ steps.restore.outcome }}'; B='${{ steps.build.outcome }}'
          T='${{ steps.test.outcome }}';    P='${{ steps.pack.outcome }}'
          F='${{ steps.format.outcome }}'

          FILE=pr-summary.md
          {
            echo "### Status: Build $(badge "$B") · Test $(badge "$T") · Format $(badge "$F") · Pack $(badge "$P")"
            echo ""
            echo "| Step    | Outcome | Duration |"
            echo "|---------|---------|----------|"
            echo "| restore | $(to_emoji "$R") $R | ${RESTORE_DUR:-—} |"
            echo "| build   | $(to_emoji "$B") $B | ${BUILD_DUR:-—} |"
            echo "| test    | $(to_emoji "$T") $T | ${TEST_DUR:-—} |"
            echo "| format  | $(to_emoji "$F") $F | ${FORMAT_DUR:-—} |"
            echo "| pack    | $(to_emoji "$P") $P | ${PACK_DUR:-—} |"
            echo ""
            if compgen -G "artifacts/*.nupkg" > /dev/null; then
              echo "**Packages**"
              echo ""
              for f in artifacts/*.nupkg; do echo "- \`$(basename "$f")\`"; done
              echo ""
            fi
            echo "**Run:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          } | tee "$FILE" >> "$GITHUB_STEP_SUMMARY"

      # The comment is posted by "ci summary" instead, which is the only job that can see the
      # guards' results. This hands it the step detail; it owns the same build-summary header.
      - name: Upload summary for the report job
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pr-summary
          path: pr-summary.md
          if-no-files-found: ignore
          retention-days: 1

      - name: Upload packages
        if: steps.pack.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: nupkg
          path: artifacts/*.nupkg
          if-no-files-found: ignore
          retention-days: 14

      # continue-on-error above means the job would otherwise report success even
      # when a phase failed. This is what actually fails it.
      - name: Gate
        if: always()
        run: |
          fail=0
          for s in '${{ steps.restore.outcome }}' '${{ steps.build.outcome }}' \
                   '${{ steps.test.outcome }}' '${{ steps.format.outcome }}' \
                   '${{ steps.pack.outcome }}'; do
            [ "$s" = "success" ] || fail=1
          done
          [ "$fail" = "0" ] || { echo "::error::One or more build phases failed — see the summary table."; exit 1; }

  # Changelog fragments. CHANGELOG.md is a single file every branch wants to edit on the same
  # few lines — the most reliable merge conflict there is — so changes are recorded one file
  # per change under changelog.d/ and folded in at release time. That only works if the
  # fragments get written, which is what this job is for.
  #
  # A separate job, not a step in "build + test": that job's name is a required status check
  # and renaming it breaks branch protection, and a missing changelog is not a broken build.
  # For this to *block* a merge rather than just show red, add "changelog fragment" to the
  # branch-protection required checks.
  changelog:
    name: changelog fragment
    # Dependabot touches src/**/*.csproj on every bump and ships its own changelog, and
    # [no-changelog] in the title is the escape hatch for the mechanical src/ change that has
    # nothing to tell a host. It sits in the PR title where a reviewer sees it.
    if: >-
      github.event_name == 'pull_request'
      && github.event.pull_request.user.login != 'dependabot[bot]'
      && !contains(github.event.pull_request.title, '[no-changelog]')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          # The check diffs against the merge base, so it needs both sides of the history.
          fetch-depth: 0

      - name: Require a changelog fragment for src/ changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        # The same script developers can run locally before pushing, so a red check here is
        # never a surprise that only CI knows how to reproduce.
        run: ./scripts/check-changelog-fragment.sh "$BASE_SHA" "$HEAD_SHA"

  # The two sample hosts share one stylesheet, copied. Nothing about a build notices when the
  # copies stop agreeing — the drift shows up as a component that looks broken in one sample and
  # fine in the other, which is the reading it least deserves. Nor does anything notice when both
  # copies are missing the same rules, which looks broken in both. The script checks for each in
  # turn; see its header.
  #
  # Its own job, like the changelog check and for the same reason: "build + test" is a required
  # status check whose name must not move, and sample CSS drift is not a broken build.
  # And with the same consequence: for this to *block* a merge rather than just show red, add
  # "sample stylesheets in step" to the branch-protection required checks. Until it is added,
  # a drifted PR shows this job red and merges anyway — which is weaker than the script header
  # and the README both imply.
  sample-css:
    name: sample stylesheets in step
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Assert the sample hosts' stylesheets are identical and complete
        # The same script developers can run locally before pushing, so a red check here is
        # never a surprise that only CI knows how to reproduce.
        run: ./scripts/assert-sample-css-in-step.sh

  # BannedSymbols.txt is the only thing keeping host-specific types out of a component that has to
  # render in two hosts, and it is wired up by a condition on the RCL's project name. That
  # condition was stale for the whole time the merged project had a different name than it named:
  # no analyzer, no RS0030, every build green. A guard that fails open cannot report its own
  # absence, so the guard gets a check of its own.
  #
  # Its own job for the same reason as the two above — "build + test" is a required status check
  # whose name must not move — and with the same consequence: add "portability guard armed" to the
  # branch-protection required checks for this to block a merge rather than only show red.
  portability-guard:
    name: portability guard armed
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Cache NuGet
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Build.props') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Assert a banned symbol still fails the RCL build
        # The same script developers can run locally before pushing, so a red check here is
        # never a surprise that only CI knows how to reproduce.
        run: ./scripts/assert-portability-guard-armed.sh

  # A step reads steps.<id>.outcome, which is job-local, so the summary inside "build + test"
  # could only ever report itself and the four guards were never in the comment. A job added to
  # this workflow must be added to needs: below and to the table, or it stays invisible here.
  report:
    name: ci summary
    needs: [build, changelog, sample-css, portability-guard]
    # It exists to report failed and skipped jobs, so it must not be skipped by one.
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # A new name, so branch protection does not match it and it blocks nothing — the same
    # asymmetry the guards above carry. Add "ci summary" to the required checks to change that.
    steps:
      - name: Download the build job's step detail
        # Absent when build never reached its Summary step; the job table still posts without it.
        continue-on-error: true
        uses: actions/download-artifact@v7
        with:
          name: pr-summary

      - name: Summary
        run: |
          to_emoji() { case "$1" in success) echo "✅";; failure) echo "❌";; cancelled) echo "🚫";; skipped) echo "⏭️";; *) echo "❔";; esac; }

          # Heredoc, not a pipe: a pipe runs the loop in a subshell and every bad=1 is discarded,
          # so a red job would print in the table and still be headlined as a pass.
          rows=""
          bad=0
          while IFS='|' read -r name result; do
            [ -n "$name" ] || continue
            case "$result" in success|skipped) ;; *) bad=1 ;; esac
            rows="$rows| $name | $(to_emoji "$result") $result |"$'\n'
          done <<EOF
          build + test|${{ needs.build.result }}
          changelog fragment|${{ needs.changelog.result }}
          sample stylesheets in step|${{ needs['sample-css'].result }}
          portability guard armed|${{ needs['portability-guard'].result }}
          EOF

          FILE=ci-summary.md
          {
            if [ "$bad" = "0" ]; then
              echo "## CI ✅ every job passed"
            else
              echo "## CI ❌ one or more jobs failed"
            fi
            echo ""
            echo "| Job | Result |"
            echo "|-----|--------|"
            printf '%s' "$rows"
            echo ""

            if [ -f pr-summary.md ]; then
              cat pr-summary.md
            else
              echo "_No step detail from \`build + test\` for this run._"
              echo ""
              echo "**Run:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            fi
          } | tee "$FILE" >> "$GITHUB_STEP_SUMMARY"

      - name: Comment summary on PR
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          header: build-summary
          path: ci-summary.md
