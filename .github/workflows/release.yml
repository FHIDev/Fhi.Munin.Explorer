name: Release

# Publishing is triggered by a tag, not by a merge to main.
#
# A version that has gone out is spent. The feed does allow one to be deleted, but anyone who
# restored it in the meantime keeps what they got, so re-using the number gives two different
# builds the same name. Publishing on every merge would make that a side effect of ordinary work.
# A tag is somebody deciding "this one goes out", which is the right weight for it.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write # create the GitHub Release for the tag, and push the changelog branch
  pull-requests: write # open the pull request that records the assembled changelog on main

concurrency:
  # Deliberately not cancel-in-progress. Cancelling a run mid-push leaves nobody able to say
  # whether the package reached the feed, and letting the job finish is the only clean way out.
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: publish to the internal feed
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7
        with:
          # The "tag is on main" check below walks history, so it needs more than the tag. The
          # changelog step needs origin/main for the same reason, and the checkout's own
          # credentials to push its branch — persist-credentials, left at its default.
          fetch-depth: 0

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Read the version from the tag
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"

          # A tag like "v0.2" or "vlatest" would otherwise pack as some surprising version and
          # claim it forever. Prerelease suffixes are allowed; build metadata (+foo) is not,
          # because NuGet ignores it and two tags would resolve to one version.
          # Leading zeros are rejected too: NuGet normalises 01.2.3 to 1.2.3, so the tag and the
          # version people can actually install would disagree from the day it shipped.
          if ! echo "$VERSION" | grep -Eq '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.]+)?$'; then
            echo "::error::Tag '$GITHUB_REF_NAME' does not give a usable version. Expected vMAJOR.MINOR.PATCH, optionally with a prerelease suffix — for example v0.2.0 or v0.2.0-beta.1."
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Publishing $VERSION"

      - name: Refuse to publish a commit that is not on main
        run: |
          # Without this, a tag pushed from any branch would publish code that never passed
          # review. A published version is permanent; the bar for what goes in it is the
          # same bar as main.
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag '$GITHUB_REF_NAME' points at a commit that is not on origin/main. Merge it first, then tag the merge commit."
            exit 1
          fi

      - name: Check the push credential is present
        env:
          ADO_PACKAGING_TOKEN: ${{ secrets.ADO_PACKAGING_TOKEN }}
        run: |
          # Checked before building rather than after: failing at the push step means a green
          # build, a created tag, and nothing published — the confusing half-done state.
          if [ -z "$ADO_PACKAGING_TOKEN" ]; then
            echo "::error::Secret ADO_PACKAGING_TOKEN is not available to this repository. Create a personal access token in Azure DevOps for the fhi organisation with Packaging (Read & write), and add it under Settings → Secrets and variables → Actions."
            exit 1
          fi

      - name: Assemble the changelog for this tag
        id: changelog
        # Before the pack step, and that ordering is the whole point of this step. The package's
        # release notes ARE this version's section: packing first would stamp the version with
        # notes nobody had written yet, and the fix for that is not a link to go and look.
        #
        # Eight versions shipped before this ran automatically, because it was a documented
        # manual step and a documented manual step does not get run (Fhi.Metadata-l9l2n.44).
        #
        # It cannot push to main itself — MainRules requires a pull request there and has no
        # bypass actors — so it prepares the commit on a branch and the next step offers it.
        # The script's header has the rest.
        run: |
          git fetch --quiet origin +refs/heads/main:refs/remotes/origin/main
          ./scripts/release-changelog.sh "${{ steps.version.outputs.version }}" \
            --tag-sha "$GITHUB_SHA" \
            --base origin/main \
            --notes "$GITHUB_WORKSPACE/release-notes.md"

      - name: Open the pull request that records it on main
        if: steps.changelog.outputs.assembled == 'true'
        # Before the push to the feed, not after: this is the recoverable half. A run that dies
        # here has published nothing and re-running it assembles the same section again, while a
        # run that died after the push could never come back to record what it shipped — the
        # feed pre-flight stops a re-run of a version that is already out.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ steps.changelog.outputs.branch }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [ -n "$(gh pr list --head "$BRANCH" --state open --json number --jq '.[].number')" ]; then
            echo "A pull request for $BRANCH is already open — left as it is."
            exit 0
          fi

          # GitHub does not run workflows for events its own GITHUB_TOKEN caused, so this pull
          # request arrives with its required checks unreported and cannot merge until a human
          # reopens it or pushes to the branch. Saying so in the body beats leaving somebody to
          # work it out from a merge button that never lights up.
          {
            echo 'Opened by `.github/workflows/release.yml` when the tag was pushed: this'
            echo 'version section in `CHANGELOG.md`, and the fragments it consumed removed in the'
            echo 'same commit.'
            echo
            echo 'The package and the GitHub release for this tag already carry these notes.'
            echo 'Merging this is what puts them in `CHANGELOG.md` on `main` and clears'
            echo '`changelog.d/`. Until it merges the fragments in it are still queued, and the'
            echo 'next release would publish them again under its own version.'
            echo
            echo '**CI has not reported on this pull request and will not on its own.** GitHub'
            echo 'suppresses workflow runs for events caused by `GITHUB_TOKEN`, so the required'
            echo 'checks sit unreported and the merge button stays shut. Close and reopen it, or'
            echo 'push an empty commit, and they run.'
          } > "$RUNNER_TEMP/pr-body.md"

          gh pr create --base main --head "$BRANCH" \
            --title "docs(changelog): assemble v$VERSION" \
            --body-file "$RUNNER_TEMP/pr-body.md"

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore -p:Version=${{ steps.version.outputs.version }}

      - name: Test
        # A published version cannot be withdrawn, so the tests run here too rather than
        # trusting that main was green when the tag was cut.
        run: dotnet test --configuration Release --no-build --verbosity quiet

      - name: Pack
        # PackageReleaseNotes carries THIS version's changelog section, not a link to go and read
        # one. It was the link alone until Fhi.Metadata-l9l2n.44, which was as good as the notes
        # it pointed at: auto-generated commit titles, because nothing assembled the changelog.
        # A consumer taking a breaking version reads this string on the feed, and helsedata took
        # one — 0.1.0-alpha.8 deleted a component — with nothing curated to read.
        #
        # The link stays, after the notes. It points at the release for the tag rather than at
        # CHANGELOG.md on main, because that release never changes after it is cut while main
        # moves on: a link to main would age into pointing an old package at a later version's
        # entry.
        #
        # Through a file, not -p:PackageReleaseNotes=: the notes are multi-line and full of
        # semicolons, and an MSBuild command-line property loses the first and splits on the
        # second. Directory.Build.props reads the file this writes.
        run: |
          NOTES="$GITHUB_WORKSPACE/package-release-notes.md"
          if [ -s "$GITHUB_WORKSPACE/release-notes.md" ]; then
            cat "$GITHUB_WORKSPACE/release-notes.md" > "$NOTES"
          else
            printf 'No changelog entry was assembled for this version.\n' > "$NOTES"
          fi
          printf '\nRelease notes for %s: https://github.com/%s/releases/tag/%s\n' \
            '${{ github.ref_name }}' '${{ github.repository }}' '${{ github.ref_name }}' >> "$NOTES"

          dotnet pack --configuration Release --no-build --output artifacts \
            -p:Version=${{ steps.version.outputs.version }} \
            -p:PackageReleaseNotesFile="$NOTES"

      - name: Assert package contents
        # Last gate before the irreversible step. Also catches a version mismatch between the
        # tag and what actually got packed.
        run: ./scripts/assert-package-contents.sh artifacts "${{ steps.version.outputs.version }}"

      - name: Push to the internal feed
        env:
          # A PAT, because that is the paved road at FHI for this particular leg. It was not the
          # obvious answer, so the reasoning is worth keeping.
          #
          # An Entra token authenticates against this feed - verified - so OIDC would work in
          # principle, and it is what every FHI repo uses for Azure RESOURCES. But the feed is
          # Azure DevOps, not Azure, and reaching it that way needs the app's service principal to
          # be a MEMBER of the ADO organisation. That organisation has none today.
          #
          # Fhi.Grossiststatistikken is the one other FHIDev repo that talks to an ADO feed, and it
          # settles it: the same repo signs in to Azure with OIDC in one workflow and reaches the
          # feed with AZURE_DEVOPS_PAT_LMR_NUGET in another. They had OIDC in hand and still used a
          # PAT here.
          #
          # The script takes whatever this is and does not inspect it, so moving to OIDC later is
          # this block swapped for an azure/login step - see Fhi.Metadata-l9l2n.5.
          NUGET_PUBLISH_TOKEN: ${{ secrets.ADO_PACKAGING_TOKEN }}
        # Retries a failed push, and refuses a version the feed already has — so a network blip
        # is fixed by re-running rather than by hand, while a genuinely reused tag stops the run.
        # See the script's header.
        run: ./scripts/push-packages.sh artifacts "${{ steps.version.outputs.version }}"

      # The release records that a version went out and what changed in it. It carries no
      # .nupkg, and that is the point: this repository is public, so an attached package would be
      # downloadable by anyone, from outside the feed and outside whatever access the feed
      # controls. Two places to get a package is also one place to get the wrong one.
      #
      # The package lives in exactly one place, which is what "internal" has to mean to be worth
      # anything. Nothing here is secret - the source is public and the licence is MIT - but where
      # a consumer is meant to get a build from is a decision, and it should have one answer.
      - name: Create the GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: v${{ steps.version.outputs.version }}
          # The assembled section first, then the generated commit titles under it. The section
          # is what a consumer needs and the commit list is what it was left with for eight
          # versions; this is also the copy that outlives the branch, since the release for a
          # tag is fixed and the file on main is not.
          body_path: release-notes.md
          generate_release_notes: true
          # A prerelease tag (v0.2.0-beta.1) is marked as one on GitHub too, so the release
          # list says the same thing the feed does.
          prerelease: ${{ contains(steps.version.outputs.version, '-') }}
