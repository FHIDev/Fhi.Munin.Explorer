name: Secret scan
# gitleaks on every PR and on main, as in Fhi.Munin.DevInfra's pr-checks (same pinned binary and checksum). A PR is
# scanned for the commits it adds; main for its whole history, so a token committed before push protection shows too.
# Known fixtures are listed by fingerprint in .gitleaksignore, never by value.
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  gitleaks:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GITLEAKS_VERSION: "8.28.0"
      GITLEAKS_SHA256: a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # The binary, not gitleaks-action: the action needs a paid licence key for an organisation's repos.
      # --remerge-diff adds what a merge's resolution itself changed, which plain git log leaves out.
      # No --verbose: it prints each commit's author name and email. A finding is shown by fingerprint only.
      - name: gitleaks
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          curl -sSfL -o "$RUNNER_TEMP/gitleaks.tar.gz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          if [ -n "$BASE_SHA" ]; then range="${BASE_SHA}..${HEAD_SHA}"; else range="HEAD"; fi
          report="$RUNNER_TEMP/gitleaks.json"
          status=0
          "$RUNNER_TEMP/gitleaks" git . --no-banner --redact --log-opts="--remerge-diff ${range}" \
            --report-format json --report-path "$report" || status=$?
          if [ "$status" -ne 0 ] && [ -s "$report" ]; then
            jq -r '.[].Fingerprint' "$report"
          fi
          exit "$status"
