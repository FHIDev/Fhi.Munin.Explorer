# Shows red when a session's PR lacks its "Pre-PR review:" line (DevInfra-9w1.40). The line and its four forms are
# in AGENTS.md or CLAUDE.md. Applies only to PRs whose description ends with the sessions' footer; any other PR passes untouched.
# It proves the line is there, not that the review ran. Not a required check: making it one is a ruleset change.
name: Pre-PR review line

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions: {}

concurrency:
  group: pre-pr-review-line-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  line:
    name: Pre-PR review line
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: The description says what the pre-PR review found
        env:
          BODY: ${{ github.event.pull_request.body }}
        run: |
          body=$(printf '%s' "$BODY" | tr -d '\r')
          last=$(printf '%s\n' "$body" | awk 'NF { line = $0 } END { print line }')
          case $last in
            *"Generated with AI"*) ;;
            *) echo "Not a session's PR (the description does not end with the footer): nothing to check."; exit 0 ;;
          esac
          lines=$(printf '%s\n' "$body" | grep -E '^Pre-PR review:' || true)
          if [ -z "$lines" ]; then
            echo "::error::The description has no line that starts with 'Pre-PR review:'. Add one of the four forms (they are in AGENTS.md or CLAUDE.md), on a line of its own."
            exit 1
          fi
          if [ "$(printf '%s\n' "$lines" | wc -l)" -ne 1 ]; then
            echo "::error::The description has more than one 'Pre-PR review:' line; keep one."
            exit 1
          fi
          form='^Pre-PR review: (ran, (no findings|[0-9]+ findings?, fixed|[0-9]+ findings?, [0-9]+ fixed, [0-9]+ left: .+)|skipped, .+)$'
          if ! printf '%s\n' "$lines" | grep -Eq "$form"; then
            echo "::error::'$lines' is not one of the four forms: 'ran, no findings' | 'ran, N findings, fixed' | 'ran, N findings, X fixed, Y left: why' | 'skipped, reason'."
            exit 1
          fi
          case $lines in
            *"<"*">"*) echo "::error::The line still holds a placeholder in angle brackets: '$lines'."; exit 1 ;;
          esac
          if printf '%s\n' "$lines" | grep -Eq 'left: '; then
            read -r found fixed left <<< "$(printf '%s\n' "$lines" | sed -E 's/^Pre-PR review: ran, ([0-9]+) findings?, ([0-9]+) fixed, ([0-9]+) left: .*/\1 \2 \3/')"
            if [ "$(( 10#$fixed + 10#$left ))" -ne "$(( 10#$found ))" ]; then
              echo "::error::$fixed fixed and $left left do not add up to $found findings."
              exit 1
            fi
          fi
          echo "$lines"
