name: Check a feed credential

# What can this token actually do against the package feed?
#
# Run by hand, never on a schedule or a push. It exists because a credential's rights are not
# visible from outside it: the organisation has a shared AZURE_DEVOPS_PAT whose scopes nobody
# here knows, and the only honest way to find out is to try it and report what happened.
#
# It NEVER prints the token, or any part of it. Every step reports a status code or a yes/no.
# That is deliberate: a workflow log is readable by anyone with access to the repository, and a
# leaked packaging credential would let a stranger publish under our package ids.
#
# Read is proven by reading. WRITE IS DELIBERATELY NOT TESTED, and the reason is a mistake worth
# recording: proving a push means pushing, and when I checked ADO_PACKAGING_TOKEN by running the
# real push script against the feed on 2026-08-21, three test packages published for real. They
# were deleted within the minute, but the feed is shared and that was not mine to do.
#
# So this workflow reads and stops. A token that reads may still lack Read & write; treat a green
# run as "worth trying", not as "cleared to publish". The honest test of write is a prerelease tag
# that was going out anyway.

on:
  workflow_dispatch:
    inputs:
      secret_name:
        description: 'Which secret to test'
        required: true
        default: ADO_PACKAGING_TOKEN
        type: choice
        options:
          - ADO_PACKAGING_TOKEN
          - AZURE_DEVOPS_PAT

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Probe the feed
        env:
          # Both are read in, and only the chosen one is used. A secret that does not exist comes
          # through as an empty string, which the first check below reports rather than failing on
          # some later confusing error.
          ADO_PACKAGING_TOKEN: ${{ secrets.ADO_PACKAGING_TOKEN }}
          AZURE_DEVOPS_PAT: ${{ secrets.AZURE_DEVOPS_PAT }}
          CHOICE: ${{ inputs.secret_name }}
        run: |
          set -uo pipefail

          case "$CHOICE" in
            ADO_PACKAGING_TOKEN) TOKEN="$ADO_PACKAGING_TOKEN" ;;
            AZURE_DEVOPS_PAT)    TOKEN="$AZURE_DEVOPS_PAT" ;;
            *) echo "::error::Unknown secret $CHOICE"; exit 1 ;;
          esac

          if [ -z "$TOKEN" ]; then
            echo "::error::$CHOICE is empty or not available to this repository."
            exit 1
          fi

          # Length only. Enough to tell a PAT (~52 chars) from an Entra token (~2600) and to show
          # something arrived, without revealing any of it.
          echo "$CHOICE is present, ${#TOKEN} characters."

          FEED=https://fhi.pkgs.visualstudio.com/Fhi.Helsedata/_packaging/Fhi.Helsedata.no/nuget/v3

          # A package that exists on the feed. Reading its version list proves the credential is
          # accepted and has at least Packaging read.
          CODE=$(curl -sS -o /dev/null -w '%{http_code}' \
            -u ":$TOKEN" "$FEED/flat2/fhi.helsedata.stiler/index.json" || echo 000)

          echo "Reading a known package: HTTP $CODE"

          case "$CODE" in
            200)
              echo "  Accepted, and can read the feed."
              ;;
            401|403)
              echo "::error::  Rejected. This credential cannot read the feed, so it certainly cannot publish to it."
              exit 1
              ;;
            *)
              echo "::error::  Unexpected status $CODE — treat as inconclusive rather than as a pass."
              exit 1
              ;;
          esac

          # The publish endpoint is advertised in the service index. Its presence says the feed
          # offers publishing; it does not say this token is allowed to use it.
          if curl -sS -u ":$TOKEN" "$FEED/index.json" | grep -q PackagePublish; then
            echo "  The feed advertises a publish endpoint."
          fi

          echo
          echo "Read access confirmed. Write access is NOT confirmed by this run — the only way to"
          echo "prove a push is to push, which is why this workflow does not try. If this token is"
          echo "meant to publish, the next real test is a prerelease tag."
